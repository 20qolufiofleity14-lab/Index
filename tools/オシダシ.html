<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1b1712">
<title>オシダシ</title>
<meta name="mini-category" content="other">
<meta name="mini-desc" content="押して、ぶつけて、落とす。デッキ構築×マス目タクティクスのローグライト">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap">
<style>
/* 【見た目】判定のあるもの（床・岩・穴・敵の攻撃マス）を明るく強く、背景は暗く控えめに（桜井 #030） */
:root{
  --bg:#1b1712;--bg2:#26201a;--panel:#2f2720;--fg:#f4ead8;--muted:#b5a68c;
  --floor:#e2cfa4;--floor2:#d6c08f;--rock:#5d5a55;--pit:#0b0907;
  --pl:#2a6fd6;--en:#c9312f;--gold:#f2c14e;--blk:#5fa8ff;--ok:#5fcf8f;
  --T:56px;
  --f:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --title:"Dela Gothic One","Hiragino Sans",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--f);overscroll-behavior:none}
body{display:flex;justify-content:center}
#app{width:100%;max-width:480px;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font-family:var(--f);font-weight:800;border:0;border-radius:12px;padding:12px 16px;font-size:16px;cursor:pointer;
  background:var(--gold);color:#2a1d05;box-shadow:0 3px 0 #8a6a1c}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #8a6a1c}
button.sub{background:#4a3f33;color:var(--fg);box-shadow:0 3px 0 #2a231c}
button:disabled{opacity:.4}
.scr{flex:1;display:flex;flex-direction:column;overflow:auto}

/* タイトル */
.title{align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;
  background:radial-gradient(circle at 50% 35%,#4a2d1a 0,#1b1712 70%)}
.title h1{font-family:var(--title);font-size:64px;margin:0;letter-spacing:.04em;color:var(--gold);
  text-shadow:0 4px 0 #6b3b12,0 0 30px rgba(242,193,78,.35);transform:rotate(-3deg)}
.title .tag{font-size:18px;font-weight:800}
.title .demo{font-size:44px;letter-spacing:2px;margin:6px 0 4px}
.title .demo span{display:inline-block}
.title .demo .e{animation:demo 1.6s infinite}
@keyframes demo{0%,40%{transform:translateX(0)}55%{transform:translateX(28px)}70%{transform:translate(40px,30px) scale(.2);opacity:0}71%,100%{transform:none;opacity:1}}
.title .demo .p{animation:demo2 1.6s infinite}
@keyframes demo2{0%,30%{transform:none}45%{transform:translateX(14px)}60%,100%{transform:none}}
.title .best{color:var(--muted);font-size:13px}
.title .btns{display:flex;flex-direction:column;gap:10px;width:min(280px,80%)}
.howto{font-size:13px;color:var(--muted);line-height:1.7;max-width:330px;text-align:left}

/* 上の帯 */
.hud{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--bg2);font-size:13px;font-weight:700;min-height:42px}
.hpbar{flex:1;height:22px;background:#3a1414;border-radius:11px;position:relative;overflow:hidden;border:2px solid #000}
.hpbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#e94d4a,#a82422);transition:width .2s}
.hpbar em{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,#ffb3b3 0 4px,#ff6b6b 4px 8px);opacity:.85;transition:all .2s}
.hpbar b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;text-shadow:0 1px 2px #000}
.blk{color:var(--blk);font-weight:900}
.relics{display:flex;gap:2px;font-size:16px}
.relics span{cursor:pointer}
.pill{background:#000a;border-radius:10px;padding:2px 7px;white-space:nowrap}

/* 盤 */
#bwrap{display:flex;justify-content:center;padding:8px 0 4px;position:relative}
#board{position:relative;width:calc(var(--T)*6);height:calc(var(--T)*6);border-radius:8px;
  box-shadow:0 0 0 3px #000,0 0 0 6px #4a3a2a,0 10px 30px #000}
.tile{position:absolute;width:var(--T);height:var(--T);border:1px solid rgba(0,0,0,.18)}
.tile.f{background:var(--floor)}
.tile.f.alt{background:var(--floor2)}
.tile.r{background:radial-gradient(circle at 35% 30%,#9a958c 0,#5d5a55 45%,#3a3733 100%);border-color:#000;box-shadow:inset 0 -6px 0 rgba(0,0,0,.35)}
.tile.p{background:radial-gradient(circle,#000 0,#000 45%,#1d140c 100%);box-shadow:inset 0 6px 10px #000}
.tile.p::after{content:"";position:absolute;inset:3px;border:2px dashed rgba(255,190,90,.25);border-radius:4px}
.tile .dz{position:absolute;inset:0;pointer-events:none}
.tile.dg .dz{background:repeating-linear-gradient(135deg,rgba(220,30,30,.55) 0 6px,rgba(220,30,30,.32) 6px 12px);box-shadow:inset 0 0 0 2px #b00}
.tile.dz-abs .dz{background:repeating-linear-gradient(135deg,rgba(150,60,230,.55) 0 6px,rgba(150,60,230,.3) 6px 12px);box-shadow:inset 0 0 0 2px #6a1fbf}
.tile.dz-bomb .dz{background:repeating-linear-gradient(135deg,rgba(255,130,0,.6) 0 6px,rgba(255,130,0,.35) 6px 12px);box-shadow:inset 0 0 0 2px #c55a00}
.tile.dz-ch .dz{background:rgba(255,80,0,.35);box-shadow:inset 0 0 0 2px #c55a00}
.tile.dz-sum .dz{box-shadow:inset 0 0 0 3px #3fbf5f;background:rgba(63,191,95,.25)}
.tile.dim .dz{opacity:.35}
.tile .dn{position:absolute;right:2px;bottom:1px;font-size:12px;font-weight:900;color:#fff;text-shadow:0 0 2px #000,0 0 2px #000;pointer-events:none}
.tile.rc::before{content:"";position:absolute;inset:6px;border-radius:50%;background:rgba(42,111,214,.35);box-shadow:0 0 0 2px rgba(42,111,214,.8);animation:pulse 1s infinite}
.tile.tg::before{content:"";position:absolute;inset:1px;border:3px solid #ffe14a;border-radius:6px;box-shadow:0 0 10px #ffe14a;animation:pulse .8s infinite;z-index:3}
@keyframes pulse{50%{opacity:.55}}
#units,#fx{position:absolute;inset:0;pointer-events:none}
.unit{position:absolute;left:0;top:0;width:var(--T);height:var(--T);transition:transform .08s linear;z-index:2}
.tok{position:absolute;left:10%;top:6%;width:80%;height:80%;border-radius:50%;background:#fff8ea;display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--T)*.48);border:3px solid var(--en);box-shadow:0 0 0 2px #000,0 4px 0 rgba(0,0,0,.35);transition:transform .07s}
.unit.pl .tok{border-color:var(--pl);background:#eaf2ff}
.unit.boss .tok,.unit.elite .tok{border-width:4px;border-color:#7a0f0f;background:#ffe2d6}
.unit .hp{position:absolute;left:12%;right:12%;bottom:2px;height:6px;background:#300;border:1px solid #000;border-radius:3px;overflow:hidden}
.unit .hp i{display:block;height:100%;background:#e94d4a;transition:width .15s}
.unit.pl .hp i{background:#4fa3ff}
.unit .ord{position:absolute;left:-2px;top:-2px;width:16px;height:16px;border-radius:50%;background:#000;color:#fff;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;z-index:2}
.unit .it{position:absolute;right:-4px;top:-6px;background:#b00;color:#fff;font-size:10px;font-weight:900;border-radius:8px;padding:1px 4px;border:1px solid #000;z-index:2;white-space:nowrap}
.unit .it.abs{background:#6a1fbf}.unit .it.bomb{background:#c55a00}.unit .it.wait{background:#555}.unit .it.sum{background:#2f8f4f}
.unit .arw{position:absolute;inset:0;pointer-events:none}
.unit .arw::after{content:"";position:absolute;left:50%;top:-1px;margin-left:-6px;border:6px solid transparent;border-bottom:8px solid var(--en);border-top:0;filter:drop-shadow(0 0 1px #000)}
.unit .shd{position:absolute;left:-4px;bottom:6px;background:var(--blk);color:#001a33;font-size:10px;font-weight:900;border-radius:6px;padding:0 4px;border:1px solid #000;z-index:2}
.unit.warn .tok{animation:warn .5s infinite alternate}
@keyframes warn{to{box-shadow:0 0 0 2px #000,0 0 12px 4px #ff3b3b}}
.jit{animation:jit .06s linear infinite}
@keyframes jit{0%{translate:3px 0}25%{translate:-3px 1px}50%{translate:2px -1px}75%{translate:-2px 0}}
.jit1{animation:jit1 .06s linear infinite}
@keyframes jit1{0%{translate:1px 0}50%{translate:-1px 0}}
.wf .tok{filter:brightness(2.2) saturate(0)}
.fall .tok{transition:transform .32s ease-in,opacity .32s;transform:scale(.1) rotate(200deg)!important;opacity:0}

.num{position:absolute;font-weight:900;font-size:22px;color:#fff;-webkit-text-stroke:1.5px #000;text-shadow:0 2px 0 #000;animation:num .75s ease-out forwards;z-index:9;white-space:nowrap;transform:translateX(-50%)}
.num.blk{color:#8fc6ff;font-size:16px}.num.big{font-size:30px;color:#ffe14a}.num.heal{color:#7dffa0}
@keyframes num{0%{translate:0 0;scale:1.6}15%{scale:1}100%{translate:0 -38px;opacity:0}}
.hm{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;background:#ffe14a;z-index:8;
  clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  filter:drop-shadow(0 0 0 #000);animation:hm .16s ease-out forwards}
.hm::after{content:"";position:absolute;inset:8px;background:#fff;clip-path:inherit}
.hm.big{width:70px;height:70px;margin:-35px 0 0 -35px;background:#ff8a00}
@keyframes hm{0%{scale:.3}40%{scale:1.15}100%{scale:1;opacity:0}}
.don{position:absolute;font-family:var(--title);font-size:22px;color:#fff;-webkit-text-stroke:2px #000;transform:translate(-50%,-50%) rotate(-8deg);animation:don .5s ease-out forwards;z-index:9}
@keyframes don{0%{scale:2}20%{scale:1}100%{opacity:0;translate:0 -12px}}
.slash{position:absolute;width:var(--T);height:var(--T);background:rgba(255,255,255,.85);animation:slash .18s ease-out forwards;z-index:7}
.slash.abs{background:rgba(220,190,255,.95)}
@keyframes slash{to{opacity:0;scale:1.25}}
.praise{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--title);font-size:34px;color:var(--gold);
  -webkit-text-stroke:2px #3b1d00;text-shadow:0 4px 0 #3b1d00;white-space:nowrap;animation:praise .9s ease-out forwards;z-index:20;pointer-events:none}
@keyframes praise{0%{scale:2.2;opacity:0}12%{scale:1;opacity:1}75%{opacity:1}100%{opacity:0;translate:0 -20px}}
.flash{position:absolute;inset:0;z-index:15;pointer-events:none;animation:flash .2s steps(1) forwards}
@keyframes flash{0%{background:rgba(255,255,255,.7)}33%{background:rgba(0,0,0,.5)}66%{background:rgba(255,255,255,.35)}100%{background:transparent}}
.shk-s{animation:shs .18s}.shk-m{animation:shm .26s}.shk-l{animation:shl .4s}
@keyframes shs{0%,100%{translate:0}25%{translate:0 -2px}50%{translate:0 2px}75%{translate:0 -1px}}
@keyframes shm{0%,100%{translate:0}20%{translate:2px -4px}40%{translate:-2px 4px}60%{translate:1px -2px}80%{translate:-1px 1px}}
@keyframes shl{0%,100%{translate:0}12%{translate:-8px 2px}25%{translate:8px -2px}37%{translate:-6px 1px}50%{translate:6px -1px}62%{translate:-3px 0}75%{translate:3px 0}87%{translate:-1px 0}}

/* 情報行・操作 */
.info{margin:4px 8px 0;min-height:52px;background:#000a;border-radius:10px;padding:6px 10px;font-size:13px;line-height:1.45;border:1px solid #3a3027}
.info b{color:var(--gold)}.info .hint{color:#9fe3ff;font-weight:800}
.ctrl{display:flex;align-items:center;gap:6px;padding:6px 8px}
.orb{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a0,#f2a81e 60%,#8a4d00);color:#2a1300;
  font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;border:3px solid #000;flex:none}
.orb.z{filter:grayscale(.8) brightness(.6)}
.mv{font-weight:900;font-size:14px}
.ctrl .sp{flex:1}
.ctrl button{padding:10px 12px;font-size:14px}
#endt.hl{animation:pulse .7s infinite;background:#ffe14a}
.hand{display:flex;justify-content:center;gap:4px;padding:16px 6px 10px;min-height:150px;align-items:flex-start}
.card{flex:0 1 84px;min-width:0;height:132px;border-radius:10px;background:linear-gradient(#fff6e2,#ead6aa);color:#2a1d0c;position:relative;
  border:2px solid #000;box-shadow:0 3px 0 #000;padding:24px 5px 4px;font-size:11px;line-height:1.3;transition:transform .1s;overflow:hidden;cursor:pointer}
.card.atk{background:linear-gradient(#ffe8df,#f0b9a2)}.card.def{background:linear-gradient(#e6f0ff,#a9c6ef)}.card.skl{background:linear-gradient(#e8fbe6,#aedca6)}
.card .cn{font-weight:900;font-size:12.5px;text-align:center;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.up .cn{color:#0b7a2e}
.card .cc{position:absolute;left:3px;top:2px;width:20px;height:20px;border-radius:50%;background:#f2a81e;border:2px solid #000;font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center}
.card .ct{position:absolute;right:4px;top:3px;font-size:10px;opacity:.7}
.card.sel{transform:translateY(-14px);box-shadow:0 0 0 3px #ffe14a,0 8px 0 #000}
.card.no{filter:grayscale(.7) brightness(.7)}
.card.enter{animation:cin .18s ease-out backwards}
@keyframes cin{from{translate:0 40px;opacity:0}}
.banner{position:absolute;left:0;right:0;top:38%;text-align:center;font-family:var(--title);font-size:30px;color:#fff;
  background:linear-gradient(90deg,transparent,rgba(0,0,0,.8),transparent);padding:8px 0;z-index:30;pointer-events:none;animation:banner .55s ease-out forwards}
.banner.en{color:#ff8a80}
@keyframes banner{0%{opacity:0;translate:-40px 0}20%{opacity:1;translate:0}80%{opacity:1}100%{opacity:0;translate:30px 0}}

/* マップ */
.mapw{flex:1;overflow:auto;position:relative}
.maph{padding:10px 12px;font-weight:800;display:flex;justify-content:space-between;align-items:center;background:var(--bg2)}
.node{cursor:pointer}
.node circle{fill:#3b3127;stroke:#000;stroke-width:3}
.node.av circle{fill:#f2c14e;animation:npulse 1s infinite}
.node.done circle{fill:#6b5d4d}
.node.cur circle{fill:#2a6fd6}
@keyframes npulse{50%{fill:#ffe9a0}}
.node text{font-size:20px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted);padding:6px 12px}

/* 報酬・モーダル */
.panel{padding:16px;display:flex;flex-direction:column;gap:12px;align-items:stretch}
.panel h2{margin:0;font-family:var(--title);font-weight:400;font-size:28px;text-align:center;color:var(--gold)}
.panel p{margin:0;line-height:1.6}
.choices{display:flex;gap:8px;justify-content:center}
.choices .card{flex:0 1 110px;height:150px;font-size:12px}
.choices .card .cn{font-size:14px}
.rew{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:12px;padding:10px 12px;font-weight:700}
#modal{position:absolute;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.on{display:flex}
#modal .box{background:var(--panel);border:2px solid #000;border-radius:16px;max-height:85dvh;overflow:auto;width:100%;max-width:440px;padding:16px;display:flex;flex-direction:column;gap:10px}
#modal h3{margin:0;font-size:18px;color:var(--gold)}
.list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.list .card{flex:0 0 96px;height:126px}
.opt{text-align:left;font-size:15px}
.stats{background:#000a;border-radius:12px;padding:10px 14px;line-height:1.9;font-size:14px}
.rank{font-family:var(--title);font-size:72px;text-align:center;color:var(--gold);text-shadow:0 4px 0 #6b3b12;line-height:1}
.conf{position:absolute;top:-10px;width:8px;height:12px;z-index:40;animation:conf linear forwards;pointer-events:none}
@keyframes conf{to{translate:0 110dvh;rotate:720deg}}
.dbg{position:absolute;right:4px;top:46px;display:flex;flex-direction:column;gap:4px;z-index:60}
.dbg button{padding:4px 6px;font-size:11px}
</style>

<body>
<div id="app"></div>
<script>
'use strict';
/* =====================================================================
   オシダシ — 押して、ぶつけて、落とす。
   面白さの核（桜井 #006 リスクとリターン）：
     敵の近く＝敵の攻撃マスの近く（危ない）ほど、押し出し・穴落とし・同士討ち（大きな見返り）が取れる。
   調整したい数値は【日本語名】でここに出す（桜井 #046 / #068）。
   ===================================================================== */
const P={
  '盤のマス数':6,
  '初期HP':60,
  '毎ターンのエネルギー':3,
  '手札の枚数':5,
  '毎ターンの移動力':2,
  '衝突ダメージ':2,
  '自分が穴に落ちた時のダメージ':10,
  'ボスが穴に落ちた時のダメージ':15,
  'ヒットストップ小ms':60,
  'ヒットストップ中ms':110,
  'ヒットストップ大ms':200,
  '押し出し1マスのms':75,
  '敵行動の間隔ms':240,
  '休憩の回復割合':0.3,
  'カード削除の値段':75,
  '階の数':10,
  '敵HPの階ごとの増加率':0.07,
  '敵攻撃力が上がる階の間隔':3,
};
const N=P['盤のマス数'];
const DX=[0,1,0,-1],DY=[-1,0,1,0];
const FLOOR=0,ROCK=1,PIT=2;
const DEBUG=/debug/.test(location.search);
let SPEED=1;
let run=null;
const $=s=>document.querySelector(s);
const app=$('#app');
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const sleep=ms=>new Promise(r=>setTimeout(r,ms*SPEED));
const inB=(x,y)=>x>=0&&y>=0&&x<N&&y<N;
const man=(a,b)=>Math.abs(a.x-b.x)+Math.abs(a.y-b.y);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

/* ---------------- 音（効果音は重要度で音量差・アタック強め残響ほどほど 桜井 #032 #165） ---------------- */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,dur,type='square',vol=.2,slide=0,delay=0){const a=ac();if(!a)return;const t=a.currentTime+delay;const o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02)}
function noise(dur,vol=.3,hp=800,delay=0){const a=ac();if(!a)return;const t=a.currentTime+delay;const n=Math.floor(a.sampleRate*dur);const b=a.createBuffer(1,n,a.sampleRate);const d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp;
  const g=a.createGain();g.gain.value=vol;s.connect(f).connect(g).connect(a.destination);s.start(t)}
const SFX={
  kill(){noise(.35,.5,200);tone(160,.3,'sawtooth',.25,.3)},
  fall(){tone(700,.45,'triangle',.3,.15);noise(.12,.2,2000,.35)},
  coll(){noise(.18,.55,120);tone(90,.2,'square',.3,.5)},
  big(){noise(.06,.5,3000);noise(.22,.45,300);tone(220,.15,'square',.22,.4)},
  hit(){noise(.05,.35,2500);tone(330,.08,'square',.15,.5)},
  hurt(){tone(200,.18,'sawtooth',.25,.5);noise(.1,.3,600)},

const NODE={battle:{ic:'⚔️',n:'戦闘'},elite:{ic:'💀',n:'強敵（お守り）'},rest:{ic:'🔥',n:'休憩'},shop:{ic:'🛒',n:'店'},event:{ic:'❓',n:'出来事'},boss:{ic:'👿',n:'大鬼'}};
function genMap(){
  const F=P['階の数'];const fl=[];
  for(let f=0;f<F;f++){
    let lanes;
    if(f===0||f===F-1)lanes=[1];
    else{const c=Math.random()<.55?3:2;lanes=c===3?[0,1,2]:shuffle([0,1,2]).slice(0,2).sort()}
    fl.push(lanes.map(l=>{let t;
      if(f===0)t='battle';else if(f===F-1)t='boss';else if(f===F-2)t='rest';
      else if(f===1)t=Math.random()<.7?'battle':'event';
      else{const w=[['battle',44],['event',18],['shop',f>=2?13:0],['elite',f>=3?13:0],['rest',f>=3&&f!==F-3?12:0]];
        let s=w.reduce((a,b)=>a+b[1],0)*Math.random();t=w.find(x=>(s-=x[1])<0)[0]}
      return{lane:l,t,to:[]}}));
  }
  // 中盤に強敵を最低1つ保証（ご褒美を目の前に吊るす 桜井 #023）
  if(!fl.some(a=>a.some(n=>n.t==='elite'))){const f=4+rnd(3);pick(fl[f]).t='elite'}
  for(let f=0;f<F-1;f++)fl[f].forEach(n=>{fl[f+1].forEach((m,j)=>{if(Math.abs(m.lane-n.lane)<=1||fl[f].length===1||fl[f+1].length===1)n.to.push(j)})});
  // 入ってこないノードを救う
  for(let f=1;f<F;f++)fl[f].forEach((m,j)=>{if(!fl[f-1].some(n=>n.to.includes(j))){let best=fl[f-1].reduce((a,b)=>Math.abs(b.lane-m.lane)<Math.abs(a.lane-m.lane)?b:a);best.to.push(j)}});
  return fl;
}

let B=null,uidc=0;
function genTerrain(plPos,avoid){
  for(let tries=0;tries<200;tries++){
    const g=Array.from({length:N},()=>Array(N).fill(FLOOR));
    const nR=2+rnd(2),nP=2+rnd(3);
    const cells=[];for(let y=0;y<N-1;y++)for(let x=0;x<N;x++)if(!(x===plPos.x&&y===plPos.y)&&!avoid.some(a=>a.x===x&&a.y===y))cells.push({x,y});
    shuffle(cells);let k=0;
    for(let i=0;i<nR;i++){const c=cells[k++];g[c.y][c.x]=ROCK}
    for(let i=0;i<nP;i++){const c=cells[k++];g[c.y][c.x]=PIT}
    // 床がすべてつながっているか
    const seen=new Set([plPos.x+','+plPos.y]);const q=[plPos];
    while(q.length){const c=q.shift();for(let d=0;d<4;d++){const nx=c.x+DX[d],ny=c.y+DY[d];if(inB(nx,ny)&&g[ny][nx]===FLOOR&&!seen.has(nx+','+ny)){seen.add(nx+','+ny);q.push({x:nx,y:ny})}}}
    let total=0;g.forEach(r=>r.forEach(v=>{if(v===FLOOR)total++}));
    if(seen.size===total)return g;
  }
  return Array.from({length:N},()=>Array(N).fill(FLOOR));
}
function encounter(kind){
  const f=curFloor();
  if(kind==='boss')return['boss','goblin'];
  if(kind==='elite')return f<6?pick([['oyabun','archer'],['oyabun','goblin','bomber']]):pick([['oyabun','mage','archer'],['knight','oyabun','archer']]);
  if(f<=2)return pick([['goblin','goblin'],['goblin','archer'],['bomber','goblin','goblin'],['archer','archer']]);
  if(f<=5)return pick([['goblin','archer','goblin'],['knight','goblin'],['mage','goblin','goblin'],['bomber','bomber','archer'],['knight','archer']]);
  return pick([['knight','archer','goblin'],['mage','knight','goblin'],['archer','archer','goblin','bomber'],['knight','mage','bomber'],['goblin','goblin','archer','mage']]);
}
function makeSpec(kind){
  if(kind==='tut'){
    const g=Array.from({length:N},()=>Array(N).fill(FLOOR));
    g[1][2]=PIT;g[0][5]=PIT;g[1][0]=ROCK;g[2][4]=ROCK;g[4][0]=PIT;
    return{kind:'battle',tut:1,g,pl:{x:2,y:5},ens:[{k:'goblin',x:2,y:2,face:2},{k:'goblin',x:5,y:3,face:3}]};
  }
  const ks=encounter(kind);
  const pl={x:1+rnd(4),y:N-1};
  const spots=[];for(let y=0;y<3;y++)for(let x=0;x<N;x++)spots.push({x,y});shuffle(spots);
  let ep=ks.map((k,i)=>spots[i]);
  if(kind==='boss'){const b={x:2+rnd(2),y:1};ep=[b].concat(spots.filter(s=>man(s,b)>1).slice(0,ks.length-1))}
  const g=genTerrain(pl,ep.concat(kind==='boss'?[{x:ep[0].x,y:2}]:[]));
  return{kind,g,pl,ens:ks.map((k,i)=>({k,x:ep[i].x,y:ep[i].y,face:2}))};
}

     hand:[],drawP:[],disc:[],exh:[],energy:0,move:0,block:0,turn:0,kairiki:0,sel:-1,focus:null,busy:false,undo:null,dead:false,won:false,msg:''};
  B.pl={uid:++uidc,pl:true,x:spec.pl.x,y:spec.pl.y,hp:run.hp,maxHp:run.maxHp,alive:true,face:0};
  B.units.push(B.pl);
  const f=curFloor();
  for(const e of spec.ens)spawn(e.k,e.x,e.y,false,e.face);
  // 山札
  B.drawP=shuffle(run.deck.map(c=>({...c})));
  if(B.tut){const order=['tsuki','tsuki','kamae','fumikomi','kamae'];const rest=B.drawP.slice();B.drawP=[];
    for(const id of order){const i=rest.findIndex(c=>c.id===id);if(i>=0)B.drawP.push(rest.splice(i,1)[0])}B.drawP=rest.concat(B.drawP.reverse())}
  buildBattleDom();

}
function spawn(k,x,y,summoned,face=2){
  const d=EN[k],f=curFloor();
  const hp=Math.round(d.hp*(1+P['敵HPの階ごとの増加率']*f)*(summoned?.7:1));
  const u={uid:++uidc,k,def:d,x,y,hp,maxHp:hp,alive:true,face,intent:null,cyc:0};
  B.units.push(u);
  if(B.dom)mkUnitEl(u);
  return u;
}
const enemies=()=>B.units.filter(u=>u.alive&&!u.pl);
const unitAt=(x,y)=>B.units.find(u=>u.alive&&u.x===x&&u.y===y);
const edmg=d=>d.dmg+Math.floor(curFloor()/P['敵攻撃力が上がる階の間隔']);
function adjEnemies(){const p=B.pl,r=[];for(let d=0;d<4;d++){const u=unitAt(p.x+DX[d],p.y+DY[d]);if(u&&!u.pl)r.push([u,d])}return r}

/* ---------- 攻撃予告マス ---------- */
const okT=([x,y])=>inB(x,y)&&B.g[y][x]!==ROCK;
function lineFrom(x,y,d,stopPit){const r=[];let cx=x,cy=y;for(let i=0;i<N;i++){cx+=DX[d];cy+=DY[d];if(!inB(cx,cy)||B.g[cy][cx]===ROCK)break;if(stopPit&&B.g[cy][cx]===PIT)break;r.push([cx,cy]);if(unitAt(cx,cy))break}return r}
function intentTiles(e){
  const it=e.intent;if(!it||!e.alive)return[];const f=e.face,x=e.x,y=e.y;
  switch(it.t){
    case'front':return[[x+DX[f],y+DY[f]]].filter(okT);
    case'sweep':{const fx=x+DX[f],fy=y+DY[f],l=(f+1)%4;return[[fx,fy],[fx+DX[l],fy+DY[l]],[fx-DX[l],fy-DY[l]]].filter(okT)}
    case'line':return lineFrom(x,y,f,false);
    case'abs':return it.tiles;
    case'bomb':{const r=[];for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++)if(i||j)r.push([x+i,y+j]);return r.filter(okT)}
    case'charge':return lineFrom(x,y,f,true);
    case'summon':return it.tiles;
  }
  return[];
}
function dangerMap(){
  const m={};
  enemies().forEach((e,oi)=>{const it=e.intent;if(!it)return;const ts=intentTiles(e);
    ts.forEach(([x,y],i)=>{const k=x+','+y;const o=m[k]||(m[k]={dmg:0,cls:'dg',who:[]});
      if(it.t==='summon'){o.cls='dz-sum';return}
      if(it.t==='charge'){o.cls='dz-ch';if(i===ts.length-1&&unitAt(x,y)){o.dmg+=it.dmg}o.who.push(e);return}
      if(it.t==='abs')o.cls=o.cls==='dg'&&o.dmg?'dg':'dz-abs';
      if(it.t==='bomb')o.cls='dz-bomb';
      o.dmg+=it.dmg;o.who.push(e)})});
  return m;
}
function predicted(){const m=dangerMap();const p=B.pl;const o=m[p.x+','+p.y];return o?o.dmg:0}

/* ---------- 敵の思考 ---------- */
function faceTo(e,t){const dx=t.x-e.x,dy=t.y-e.y;if(Math.abs(dx)>=Math.abs(dy)&&dx!==0)return dx>0?1:3;return dy>0?2:0}
function bfs(u,mv){
  const res=new Map();res.set(u.x+','+u.y,{x:u.x,y:u.y,d:0,prev:null});const q=[{x:u.x,y:u.y,d:0}];
  while(q.length){const c=q.shift();if(c.d>=mv)continue;
    for(let d=0;d<4;d++){const nx=c.x+DX[d],ny=c.y+DY[d],k=nx+','+ny;
      if(!inB(nx,ny)||B.g[ny][nx]!==FLOOR||unitAt(nx,ny)||res.has(k))continue;
      res.set(k,{x:nx,y:ny,d:c.d+1,prev:c.x+','+c.y});q.push({x:nx,y:ny,d:c.d+1})}}
  return res;
}
function clearLine(a,b){if(a.x!==b.x&&a.y!==b.y)return false;const d=a.x===b.x?(b.y>a.y?2:0):(b.x>a.x?1:3);
  let x=a.x,y=a.y;while(true){x+=DX[d];y+=DY[d];if(x===b.x&&y===b.y)return true;if(!inB(x,y)||B.g[y][x]===ROCK||unitAt(x,y))return false}}
const BOSSSEQ=['sweep','charge','sweep','summon'];
function score(e,x,y){
  const p=B.pl,m=Math.abs(x-p.x)+Math.abs(y-p.y),ai=e.def.ai;
  if(ai==='ranged'){const t={x,y};const al=(x===p.x||y===p.y);if(al&&m>=2){const sv={x:e.x,y:e.y};e.x=x;e.y=y;const ok=clearLine(t,p);e.x=sv.x;e.y=sv.y;if(ok)return Math.abs(m-3)*.2}
    return 5+Math.min(Math.abs(x-p.x),Math.abs(y-p.y))+(m<2?3:0)}
  if(ai==='mage')return m>=3?m*.05:6-m;
  if(ai==='boss'&&BOSSSEQ[e.cyc%4]==='charge'){const al=(x===p.x||y===p.y);return al?m*.1:4+Math.min(Math.abs(x-p.x),Math.abs(y-p.y))}
  return m===0?99:Math.abs(m-1)*1;
}
async function aiMove(e){
  if(!e.alive)return;
  const d=e.def;if(d.ai==='bomb'&&e.intent&&e.intent.t==='bomb')return;
  if(d.ai==='boss'&&BOSSSEQ[e.cyc%4]==='summon')return;
  const R=bfs(e,d.mv);let best=null,bs=1e9;
  for(const v of R.values()){const s=score(e,v.x,v.y)+Math.random()*.3+v.d*.01;if(s<bs){bs=s;best=v}}
  if(!best||(best.x===e.x&&best.y===e.y))return;
  const path=[];let k=best.x+','+best.y;while(k){const v=R.get(k);path.unshift(v);k=v.prev}
  for(const v of path.slice(1)){e.x=v.x;e.y=v.y;e.face=faceTo(e,B.pl);place(e);await sleep(70)}
}
function plan(e,first){
  const d=e.def,p=B.pl;e.face=faceTo(e,p);
  const dm=edmg(d);
  switch(d.ai){
    case'melee':e.intent={t:d.sh,dmg:dm};break;
    case'ranged':e.intent={t:'line',dmg:dm};break;
    case'bomb':e.intent=e.cyc>=1?{t:'bomb',dmg:dm}:{t:'fuse'};e.cyc++;break;
    case'mage':{const ts=[[p.x,p.y],[p.x+1,p.y],[p.x-1,p.y],[p.x,p.y+1],[p.x,p.y-1]].filter(okT);e.intent={t:'abs',dmg:dm,tiles:ts};break}
    case'boss':{const ph=BOSSSEQ[e.cyc%4];e.cyc++;
      if(ph==='summon'){const cand=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(B.g[y][x]===FLOOR&&!unitAt(x,y)&&man({x,y},p)>=2)cand.push({x,y});
        cand.sort((a,b)=>man(a,e)-man(b,e));e.intent={t:'summon',tiles:cand.slice(0,2).map(c=>[c.x,c.y])}}
      else if(ph==='charge'){e.intent={t:'charge',dmg:dm+3}}
      else e.intent={t:'sweep',dmg:dm};break}
  }
}
function intentLabel(e){const it=e.intent;if(!it)return'';
  return{front:`⚔${it.dmg}`,sweep:`⚔${it.dmg}×3`,line:`➶${it.dmg}`,abs:`⚡${it.dmg}`,bomb:`💥${it.dmg}`,fuse:'…',charge:`突${it.dmg}`,summon:'呼'}[it.t]}
function intentText(e){const it=e.intent;if(!it)return'';
  return{front:`目の前を殴る（${it.dmg}）`,sweep:`前の3マスを薙ぎ払う（${it.dmg}）`,line:`まっすぐ射る（${it.dmg}）`,abs:`紫のマスに雷（${it.dmg}）`,
    bomb:`周り8マスで自爆（${it.dmg}）`,fuse:'導火線に火をつけている（次で自爆予告）',charge:`まっすぐ突進。ぶつかった相手に${it.dmg}＋1マス押す`,summon:'緑のマスに手下を呼ぶ'}[it.t]}

/* ---------- ターン ---------- */
function startTurn(first){
  B.turn++;run.stats.turns++;
  B.block=has('tate')?3:0;B.kairiki=0;B.undo=null;
  B.energy=P['毎ターンのエネルギー']+(first&&has('hachimaki')?1:0);
  B.move=P['毎ターンの移動力']+(has('waraji')?1:0);
  draw(P['手札の枚数']+(has('tenugui')?1:0),true);
  B.busy=false;
  if(!first){banner('あなたの番');sfx('turn')}
  if(B.tut&&B.turn===1)B.tutStep=0;

}
function draw(n,fresh){
  for(let i=0;i<n;i++){
    if(!B.drawP.length){if(!B.disc.length)break;B.drawP=shuffle(B.disc);B.disc=[]}
    if(B.hand.length>=10)break;
    const c=B.drawP.pop();c.fresh=1;B.hand.push(c);
  }
  if(!fresh)render();
}
function gainBlock(n){B.block+=n;sfx('block');float(B.pl,'🛡+'+n,'blk');render()}
function addMove(n){B.move+=n;sfx('move');float(B.pl,'👣+'+n,'blk');render()}
async function endTurn(){
  if(B.busy||B.won||B.dead)return;
  B.busy=true;B.sel=-1;B.focus=null;B.undo=null;
  B.disc.push(...B.hand);B.hand=[];
  if(B.tut&&B.tutStep<3)B.tutStep=3;
  render();
  banner('敵の番','en');await sleep(380);
  // 1) 予告どおりに攻撃（同じ情報で動く 桜井 #228：ランダムな命中判定は使わない）
  for(const e of B.units.slice()){
    if(e.pl||!e.alive)continue;
    await enemyAct(e);
    if(B.dead)break;
    if(checkWin())return;
  }
  if(B.dead)return gameOver();
  // 2) 移動して次の予告
  for(const e of enemies()){await aiMove(e);plan(e);render()}
  await sleep(120);
  if(B.tut)B.tutStep=4;
  startTurn(false);
}
async function enemyAct(e){
  const it=e.intent;if(!it)return;
  const gap=P['敵行動の間隔ms'];
  B.acting=e;render();
  if(it.t==='fuse'){await sleep(gap*.4);B.acting=null;return}
  const ts=intentTiles(e);
  if(it.t==='summon'){sfx('summon');for(const [x,y] of ts)if(B.g[y][x]===FLOOR&&!unitAt(x,y)){const u=spawn('goblin',x,y,true);plan(u)}render();await sleep(gap);B.acting=null;return}
  if(it.t==='charge'){
    sfx('big');const d=e.face;
    for(const [x,y] of ts){const o=unitAt(x,y);if(o&&o!==e){await hit(o,it.dmg,e,{big:1});if(o.alive)await push(o,d,1);break}
      e.px=e.x;e.py=e.y;e.x=x;e.y=y;place(e);await sleep(55)}
    await sleep(gap*.6);B.acting=null;return}
  await lunge(e,e.face);
  slashTiles(ts,it.t==='abs'?'abs':'');
  if(it.t==='abs')sfx('zap');
  if(it.t==='bomb'){sfx('boom');flash();shake('l');
    const vs=ts.map(([x,y])=>unitAt(x,y)).filter(Boolean);
    for(const v of vs)if(v!==e)await hit(v,it.dmg,e,{big:1});
    e.alive=false;removeEl(e,'die');B.acting=null;await sleep(gap);return}
  for(const [x,y] of ts){const o=unitAt(x,y);if(o&&o!==e)await hit(o,it.dmg,e)}
  await sleep(gap);B.acting=null;
}

/* ---------- ダメージ・押し出し ---------- */
async function hit(u,d,src,o={}){
  if(!u||!u.alive)return;
  let dealt=d;
  if(u.pl&&B.block>0){const b=Math.min(B.block,d);B.block-=b;dealt=d-b;if(b>0){float(u,'🛡'+b,'blk');sfx('block')}}
  if(dealt<=0&&d>0){render();await sleep(P['ヒットストップ小ms']);return}
  if(d<=0)return;
  u.hp-=dealt;
  const big=dealt>=10||o.big;
  hitmark(u,big);float(u,'-'+dealt,big?'big':'');
  if(u.pl)sfx('hurt');else sfx(big?'big':'hit');
  if(src&&!src.pl&&!u.pl&&src!==u){run.stats.ff++;praise('同士討ち!')}
  // ヒットストップ：受けた側を大きく、与えた側を小さく震わせる（桜井 #047）
  const hs=big?P['ヒットストップ大ms']:dealt>=5?P['ヒットストップ中ms']:P['ヒットストップ小ms'];
  jit(u,'jit',hs);if(src&&src.alive)jit(src,'jit1',hs);
  shake(big?'m':'s');
  render();
  await sleep(hs);
  if(u.hp<=0)await kill(u);
}
async function kill(u){
  if(u.pl){u.hp=0;B.dead=true;flash();shake('l');sfx('lose');render();await sleep(500);return}
  u.alive=false;run.stats.kills++;sfx('kill');removeEl(u,'die');flash();await sleep(160);render();
}
function collDmg(){return P['衝突ダメージ']+(has('mawashi')?1:0)+(has('chikaraishi')?2:0)+B.kairiki}
async function collide(u,o,nx,ny){
  const cd=collDmg();
  const fx=(u.x+(nx))/2,fy=(u.y+(ny))/2;
  don(fx,fy,'ドン!');sfx('coll');shake('m');
  run.stats.maxColl=Math.max(run.stats.maxColl,cd*(o?2:1));
  await hit(u,cd,null);
  if(o&&o.alive){await hit(o,cd,null);if(!u.pl&&!o.pl)praise('まとめて!')}
}
async function push(u,d,n,pull){
  if(!u||!u.alive||n<=0)return;
  if(u.def&&u.def.heavy)n=Math.min(n,1);
  for(let i=0;i<n;i++){
    const nx=u.x+DX[d],ny=u.y+DY[d];
    if(!inB(nx,ny)||B.g[ny][nx]===ROCK){if(!pull)await collide(u,null,nx,ny);return}
    const o=unitAt(nx,ny);
    if(o){if(!pull)await collide(u,o,nx,ny);return}
    u.px=u.x;u.py=u.y;u.x=nx;u.y=ny;place(u);sfx('slide');await sleep(P['押し出し1マスのms']);
    if(B.g[ny][nx]===PIT){await fall(u);return}
  }
}
async function fall(u){
  if(u.pl||(u.def&&u.def.boss)){
    const dmg=u.pl?P['自分が穴に落ちた時のダメージ']:P['ボスが穴に落ちた時のダメージ'];
    sfx('fall');jit(u,'jit',200);await sleep(200);
    u.x=u.px;u.y=u.py;place(u);
    if(!u.pl)praise('落ちた!');
    await hit(u,dmg,null,{big:1});return;
  }
  u.alive=false;run.stats.falls++;sfx('fall');removeEl(u,'fall');praise('落とした!');
  if(has('jizo')){heal(3)}
  await sleep(330);render();
}
function heal(n){run.hp=Math.min(run.maxHp,(B?B.pl.hp:run.hp)+n);if(B&&B.pl){B.pl.hp=run.hp;float(B.pl,'+'+n,'heal')}}
async function throwBack(u,dir){
  if(!u.alive)return;
  if(u.def.heavy){praise('重い!');return}
  const p=B.pl,back=(dir+2)%4,tx=p.x+DX[back],ty=p.y+DY[back];
  if(!inB(tx,ty)||B.g[ty][tx]===ROCK||unitAt(tx,ty)){await collide(u,unitAt(tx,ty)||null,u.x,u.y);return}
  u.px=u.x;u.py=u.y;u.x=tx;u.y=ty;place(u);u.el.querySelector('.tok').style.transform='translateY(-18px) scale(1.15)';sfx('slide');await sleep(150);
  u.el.querySelector('.tok').style.transform='';shake('s');
  if(B.g[ty][tx]===PIT)await fall(u);
}
async function atk(x,d,big){const p=B.pl;await lunge(p,x.dir);if(d>0)await hit(x.u,d,p,{big})}
async function shoot(x){const p=B.pl;const el=document.createElement('div');el.className='don';el.textContent='●';el.style.fontSize='16px';
  el.style.left=(p.x+.5)*T+'px';el.style.top=(p.y+.5)*T+'px';el.style.transition='left .12s linear,top .12s linear';$('#fx').appendChild(el);
  sfx('move');await sleep(16);el.style.left=(x.u.x+.5)*T+'px';el.style.top=(x.u.y+.5)*T+'px';await sleep(120);el.remove()}
async function drop(x,y){const el=document.createElement('div');el.className='don';el.textContent='🪨';el.style.fontSize='34px';el.style.left=(x+.5)*T+'px';el.style.top=(y-1)*T+'px';
  el.style.transition='top .14s ease-in';$('#fx').appendChild(el);await sleep(16);el.style.top=(y+.5)*T+'px';await sleep(140);el.remove();sfx('coll');shake('m')}
const pv=p=>p>0?p+(has('ootsuchi')?1:0):0;

/* ---------- 自分の操作 ---------- */
function reachMap(){if(B.move<=0)return new Map();const R=bfs(B.pl,B.move);R.delete(B.pl.x+','+B.pl.y);return R}
function cardTargets(c){
  const d=CARDS[c.id],p=B.pl,rg=crange(c),t=[];
  if(d.t==='adj'){for(let k=0;k<4;k++){const u=unitAt(p.x+DX[k],p.y+DY[k]);if(u&&!u.pl)t.push({x:u.x,y:u.y,u,dir:k})}}
  else if(d.t==='line'){for(let k=0;k<4;k++){let x=p.x,y=p.y;for(let i=0;i<rg;i++){x+=DX[k];y+=DY[k];if(!inB(x,y)||B.g[y][x]===ROCK)break;const u=unitAt(x,y);if(u){if(!u.pl)t.push({x,y,u,dir:k});break}}}}
  else if(d.t==='near'){for(const e of enemies())if(man(e,p)<=rg)t.push({x:e.x,y:e.y,u:e})}
  else if(d.t==='tile'||d.t==='any'){for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(man({x,y},p)>rg||(x===p.x&&y===p.y))continue;const u=unitAt(x,y);
    if(B.g[y][x]===FLOOR&&!u)t.push({x,y});else if(d.t==='any'&&u&&!u.pl)t.push({x,y,u})}}
  return t;
}
function playable(c){if(ccost(c)>B.energy)return'エネルギーが足りない';const d=CARDS[c.id];if(d.t==='self')return d.adj&&!adjEnemies().length?'隣に敵がいない':'';
  return cardTargets(c).length?'':'届く敵がいない'}
async function playCard(i,tg){
  const c=B.hand[i];if(!c)return;
  const why=playable(c);if(why){msg(why);sfx('bad');return}
  B.busy=true;B.sel=-1;B.undo=null;B.focus=null;
  B.energy-=ccost(c);B.hand.splice(i,1);sfx('card');
  render();
  await CARDS[c.id].fx(tg||{},cv(c));
  if(CARDS[c.id].ex)B.exh.push(c);else B.disc.push(c);
  if(B.tut&&B.tutStep<2&&run.stats.falls>0)B.tutStep=2;
  if(B.dead){return gameOver()}
  if(checkWin())return;
  B.busy=false;render();
}
async function movePl(x,y){
  const R=reachMap();const v=R.get(x+','+y);if(!v)return;
  B.busy=true;B.undo={x:B.pl.x,y:B.pl.y,move:B.move};
  const path=[];let k=x+','+y;while(k&&k!==B.pl.x+','+B.pl.y){const s=R.get(k);path.unshift(s);k=s.prev}
  for(const s of path){B.pl.x=s.x;B.pl.y=s.y;place(B.pl);sfx('move');await sleep(65)}
  B.move-=v.d;B.busy=false;
  if(B.tut&&B.tutStep===0)B.tutStep=1;
  render();
}
function undoMove(){if(!B.undo||B.busy)return;B.pl.x=B.undo.x;B.pl.y=B.undo.y;B.move=B.undo.move;B.undo=null;place(B.pl);sfx('move');render()}
function checkWin(){
  if(B.won||enemies().length)return false;
  B.won=true;B.busy=true;run.hp=Math.max(1,B.pl.hp);
  (async()=>{await sleep(250);flash();sfx('win');banner('勝ち!');await sleep(700);winBattle()})();
  return true;
}

/* ---------- 戦闘画面 ---------- */
let T=56;
function buildBattleDom(){
  T=Math.floor(Math.min(64,(Math.min(app.clientWidth,480)-20)/N,(app.clientHeight-370)/N));T=Math.max(T,40);
  app.innerHTML=`<div class="scr" id="bscr" style="overflow:hidden">${hudHtml(true)}
    <div id="bwrap"><div id="board" style="--T:${T}px"><div id="tiles"></div><div id="units"></div><div id="fx"></div></div></div>
    <div class="info" id="info"></div>
    <div class="ctrl"><div class="orb" id="orb"></div><div class="mv" id="mv"></div><div class="sp"></div>
      <button class="sub" id="pile" style="font-size:12px;padding:8px 8px">山札</button><button class="sub" id="undo">↶</button><button id="endt">ターン終了</button></div>
    <div class="hand" id="hand"></div>${DEBUG?'<div class="dbg"><button id="dw">勝つ</button><button id="de">E+3</button><button id="dsp">速</button></div>':''}</div><div id="modal"></div>`;
  document.documentElement.style.setProperty('--T',T+'px');
  B.dom=true;buildTiles();
  B.units.forEach(mkUnitEl);
  hudBind();
  $('#endt').onclick=()=>{ac();endTurn()};
  $('#undo').onclick=()=>undoMove();
  $('#pile').onclick=()=>showPiles();
  $('#tiles').onclick=ev=>{const t=ev.target.closest('.tile');if(t)tapTile(+t.dataset.x,+t.dataset.y)};
  $('#hand').onclick=ev=>{const c=ev.target.closest('.card');if(c)tapCard(+c.dataset.i)};
  if(DEBUG){$('#dw').onclick=()=>{enemies().forEach(e=>{e.alive=false;removeEl(e,'die')});checkWin()};$('#de').onclick=()=>{B.energy+=3;render()};$('#dsp').onclick=()=>{SPEED=SPEED===1?.3:1}}
}
function buildTiles(){
  const h=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++){const v=B.g[y][x];
    h.push(`<div class="tile ${v===ROCK?'r':v===PIT?'p':'f'+((x+y)%2?' alt':'')}" data-x="${x}" data-y="${y}" style="left:${x*T}px;top:${y*T}px"><div class="dz"></div><span class="dn"></span></div>`)}
  $('#tiles').innerHTML=h.join('');
}
function mkUnitEl(u){
  const el=document.createElement('div');
  el.className='unit'+(u.pl?' pl':'')+(u.def&&u.def.boss?' boss':'')+(u.def&&u.def.elite?' elite':'');
  el.innerHTML=`${u.pl?'':'<div class="arw"></div>'}<div class="tok">${u.pl?'🥋':u.def.ic}</div><div class="hp"><i></i></div>${u.pl?'<div class="shd" style="display:none"></div>':'<div class="ord"></div><div class="it"></div>'}`;
  $('#units').appendChild(el);u.el=el;place(u);
}
function place(u){if(u.el)u.el.style.transform=`translate(${u.x*T}px,${u.y*T}px)`}
function removeEl(u,cls){if(!u.el)return;u.el.classList.add(cls);const el=u.el;setTimeout(()=>el.remove(),400)}
function jit(u,cls,ms){if(!u.el)return;const t=u.el.querySelector('.tok');t.classList.add(cls);u.el.classList.add('wf');setTimeout(()=>u.el&&u.el.classList.remove('wf'),40*SPEED);setTimeout(()=>t.classList.remove(cls),ms*SPEED)}
async function lunge(u,d){if(!u.el)return;const t=u.el.querySelector('.tok');t.style.transform=`translate(${DX[d]*T*.35}px,${DY[d]*T*.35}px) scale(1.12)`;await sleep(70);t.style.transform='';}
function fxEl(cls,x,y,txt){const el=document.createElement('div');el.className=cls;el.style.left=x+'px';el.style.top=y+'px';if(txt)el.textContent=txt;$('#fx')&&$('#fx').appendChild(el);setTimeout(()=>el.remove(),900);return el}
function hitmark(u,big){fxEl('hm'+(big?' big':''),(u.x+.5)*T,(u.y+.4)*T)}
function float(u,t,cls){fxEl('num '+(cls||''),(u.x+.5)*T,(u.y+.1)*T,t)}
function don(x,y,t){fxEl('don',(x+.5)*T,(y+.5)*T,t)}
function slashTiles(ts,cls){ts.forEach(([x,y])=>{const el=fxEl('slash '+cls,x*T,y*T);})}
function shake(s){const w=$('#bwrap');if(!w)return;w.classList.remove('shk-s','shk-m','shk-l');void w.offsetWidth;w.classList.add('shk-'+s)}
function flash(){const b=$('#board');if(!b)return;const el=document.createElement('div');el.className='flash';b.appendChild(el);setTimeout(()=>el.remove(),300)}
function praise(t){const s=$('#bscr')||app;const el=document.createElement('div');el.className='praise';el.textContent=t;
  const b=$('#bwrap');if(b){el.style.top=(b.offsetTop+b.offsetHeight*.45)+'px'}s.appendChild(el);setTimeout(()=>el.remove(),950)}
function banner(t,cls){const s=$('#bscr');if(!s)return;const el=document.createElement('div');el.className='banner '+(cls||'');el.textContent=t;s.appendChild(el);setTimeout(()=>el.remove(),600)}
function msg(t){B.msg=t;render();setTimeout(()=>{if(B&&B.msg===t){B.msg='';render()}},1600)}

function tapTile(x,y){
  if(!B||B.busy||B.won||B.dead)return;ac();
  const p=B.pl,u=unitAt(x,y);
  if(B.sel>=0){
    const c=B.hand[B.sel];const d=CARDS[c.id];
    if(d.t==='self'&&u===p)return playCard(B.sel);
    const tg=cardTargets(c).find(t=>t.x===x&&t.y===y);
    if(tg)return playCard(B.sel,tg);
    B.sel=-1;render();
  }
  const R=reachMap();
  if(R.has(x+','+y)&&!u)return movePl(x,y);
  if(u&&!u.pl){B.focus=B.focus===u?null:u;render();return}
  B.focus=null;render();
}
function tapCard(i){
  if(!B||B.busy||B.won||B.dead)return;ac();
  const c=B.hand[i];if(!c)return;
  if(B.sel===i){if(CARDS[c.id].t==='self')return playCard(i);B.sel=-1;render();return}
  const why=playable(c);if(why){msg(why);sfx('bad');B.sel=-1;render();return}
  B.sel=i;B.focus=null;sfx('card');
  // 対象が1つだけなら即使う…はしない（誤操作を防ぐ）。ただし選んだ瞬間に対象を光らせる
  render();
}

function render(){
  if(!B||!B.dom)return;
  const p=B.pl;
  // HUD
  run.hp=Math.max(0,p.hp);
  hudUpdate();
  // マス
  const dm=dangerMap();
  const R=(B.sel<0&&!B.busy)?reachMap():new Map();
  const tg=B.sel>=0&&B.hand[B.sel]?cardTargets(B.hand[B.sel]):[];
  const focusTiles=B.focus&&B.focus.alive?intentTiles(B.focus).map(t=>t.join(',')):null;
  document.querySelectorAll('#tiles .tile').forEach(el=>{
    const x=+el.dataset.x,y=+el.dataset.y,k=x+','+y,o=dm[k];
    el.classList.remove('dg','dz-abs','dz-bomb','dz-ch','dz-sum','rc','tg','dim');
    const dn=el.querySelector('.dn');dn.textContent='';
    if(o){el.classList.add(o.cls==='dg'?'dg':o.cls);if(o.cls!=='dg')el.classList.add('dg');if(o.dmg)dn.textContent=o.dmg;
      if(focusTiles&&!focusTiles.includes(k))el.classList.add('dim')}
    if(R.has(k)&&!unitAt(x,y))el.classList.add('rc');
    if(tg.some(t=>t.x===x&&t.y===y))el.classList.add('tg');
    if(B.sel>=0&&CARDS[B.hand[B.sel].id].t==='self'&&x===p.x&&y===p.y)el.classList.add('tg');
  });
  // 駒
  const es=enemies();
  B.units.forEach(u=>{if(!u.el||!u.alive)return;
    u.el.querySelector('.hp i').style.width=Math.max(0,u.hp/u.maxHp*100)+'%';
    if(u.pl){const s=u.el.querySelector('.shd');s.style.display=B.block?'':'none';s.textContent='🛡'+B.block}
    else{u.el.querySelector('.ord').textContent=es.indexOf(u)+1;const it=u.el.querySelector('.it');it.textContent=intentLabel(u);
      it.className='it '+({abs:'abs',bomb:'bomb',fuse:'wait',summon:'sum'}[u.intent&&u.intent.t]||'');
      u.el.querySelector('.arw').style.transform=`rotate(${u.face*90}deg)`;
      const o=dm[u.x+','+u.y];u.el.classList.toggle('warn',!!(o&&o.dmg&&o.who.some(w=>w!==u)))}
  });
  // 情報行（ヘルプ文は用語を避け、やることを書く 桜井 #238）
  let h='';
  const TUT=['<span class="hint">① 青く光るマスをタップして、上の小鬼の目の前まで進もう</span>',
    '<span class="hint">② 「突き」をタップ → 黄色い小鬼をタップ。後ろの穴へ押し出せ！</span>',
    '<span class="hint">③ 赤いマスは次の敵の攻撃。そこから出れば当たらない。「構え」で守ってもいい。終わったら「ターン終了」</span>',
    '<span class="hint">③ 赤いマスは次の敵の攻撃。そこから出れば当たらない。終わったら「ターン終了」</span>',
    '<span class="hint">敵をぶつけ合ったり、岩や壁にぶつけたり（ドン!）、他の敵の攻撃マスに押し込むのも強い</span>'];
  if(B.msg)h=`<b>${esc(B.msg)}</b>`;
  else if(B.sel>=0){const c=B.hand[B.sel];h=`<b>${cname(c)}</b>（${ccost(c)}）${ctext(c)}<br><span class="hint">${CARDS[c.id].t==='self'?'もう一度タップで使う':'黄色く光る所をタップ'}</span>`}
  else if(B.focus&&B.focus.alive){const e=B.focus;h=`<b>${e.def.n}</b> HP ${e.hp}/${e.maxHp}　次：${intentText(e)}<br><small>${e.def.tr}</small>`}
  else if(B.tut&&B.tutStep!=null&&B.tutStep<5)h=TUT[B.tutStep];
  else{const pr=predicted();h=pr?`このままだと <b style="color:#ff8a80">${Math.max(0,pr-B.block)}ダメージ</b>${B.block?`（ブロック${B.block}で軽減）`:''}。赤いマスから出るか、守ろう`:'敵をタップで詳しく。青いマスで移動、カードで攻撃'}
  $('#info').innerHTML=h;
  // 操作
  const orb=$('#orb');orb.textContent=`${B.energy}/${P['毎ターンのエネルギー']}`;orb.classList.toggle('z',B.energy<=0);
  $('#mv').innerHTML=`👣${B.move}`;
  $('#pile').textContent=`山${B.drawP.length}/捨${B.disc.length}`;
  $('#undo').disabled=!B.undo||B.busy;
  const anyPlay=B.hand.some(c=>!playable(c));
  $('#endt').classList.toggle('hl',!anyPlay&&!B.busy);$('#endt').disabled=B.busy;
  // 手札
  const hd=$('#hand');
  hd.innerHTML=B.hand.map((c,i)=>{const no=!!playable(c);const d=CARDS[c.id];
    return`<div class="card ${d.k} ${c.up?'up':''} ${i===B.sel?'sel':''} ${no?'no':''} ${c.fresh?'enter':''}" data-i="${i}" style="${c.fresh?`animation-delay:${i*40}ms`:''}">
      <div class="cc">${ccost(c)}</div><div class="ct">${{atk:'攻',def:'守',skl:'技'}[d.k]}</div><div class="cn">${cname(c)}</div>${ctext(c)}</div>`}).join('');
  B.hand.forEach(c=>delete c.fresh);
}

function hudUpdate(){
  const b=$('#hpb');if(!b)return;

  b.querySelector('i').style.width=(hp/run.maxHp*100)+'%';
  const em=b.querySelector('em');
  let pr=0;if(B&&B.dom&&!B.won&&!B.dead&&!B.busy)pr=Math.max(0,predicted()-B.block);
  pr=Math.min(pr,hp);em.style.left=((hp-pr)/run.maxHp*100)+'%';em.style.width=(pr/run.maxHp*100)+'%';
  b.querySelector('b').innerHTML=`HP ${hp}/${run.maxHp}${B&&B.dom&&B.block?` <span class="blk">🛡${B.block}</span>`:''}${pr?` <span style="color:#ffd0d0">（-${pr}予告）</span>`:''}`;
  const g=$('#gold');if(g)g.textContent=run.gold;
}

function showHelp(){modal(`<h3>遊び方</h3><div class="howto" style="max-width:none;color:var(--fg)">

  <p>🟪 紫＝場所が固定の雷。🟧 オレンジ＝自爆の範囲。🟩 緑＝手下が出てくる所。</p>
  <p>敵をタップすると、性格と次の行動が見られる。</p></div>
  ${B&&B.dom?'<button class="sub" onclick="closeModal();giveUp()">あきらめる</button>':''}<button onclick="closeModal()">閉じる</button>`)}

   報酬・休憩・店・出来事

function rollCards(n,elite){
  const w=elite?{c:40,u:45,r:15}:{c:60,u:32,r:8};
  const pool=Object.keys(CARDS).filter(k=>CARDS[k].r!=='s');const out=[];
  while(out.length<n){let s=Math.random()*100;const r=s<w.c?'c':s<w.c+w.u?'u':'r';const cs=pool.filter(k=>CARDS[k].r===r&&!out.includes(k));if(cs.length)out.push(pick(cs))}
  return out.map(id=>({id,up:Math.random()<.08}));
}
function rollRelic(){const own=run.relics;const c=Object.keys(RELICS).filter(k=>k!=='mawashi'&&!own.includes(k));return c.length?pick(c):null}
function gainGold(n){n=Math.round(n*(has('maneki')?1.5:1));run.gold+=n;sfx('coin');return n}
function winBattle(){
  const kind=B.kind;
  if(has('yakusou'))run.hp=Math.min(run.maxHp,run.hp+5);
  run.floorsDone=curFloor()+1;
  B=null;
  if(kind==='boss')return showEnd(true);
  const g=gainGold(kind==='elite'?28+rnd(10):12+rnd(9));
  const relic=kind==='elite'?rollRelic():null;if(relic)run.relics.push(relic);
  const cards=rollCards(3,kind==='elite');
  app.innerHTML=`<div class="scr">${hudHtml()}<div class="panel"><h2>勝ち！</h2>
    <div class="rew">💰 ${g}ゴールド</div>
    ${relic?`<div class="rew" style="background:#4a3a14">${RELICS[relic].ic} お守り「${RELICS[relic].n}」— ${RELICS[relic].tx}</div>`:''}
    <p style="text-align:center;font-weight:800">技を1つ覚える</p>
    <div class="choices">${cards.map((c,i)=>cardHtml(c,`data-i="${i}"`)).join('')}</div>
    <button class="sub" id="skip">覚えない</button></div></div><div id="modal"></div>`;
  hudBind();
  document.querySelectorAll('.choices .card').forEach(el=>el.onclick=()=>{run.deck.push(cards[+el.dataset.i]);sfx('coin');showMap()});
  $('#skip').onclick=()=>showMap();
}
function pickCard(title,filter,cb){
  const list=run.deck.map((c,i)=>({c,i})).filter(o=>filter(o.c));
  modal(`<h3>${title}</h3><div class="list">${list.map(o=>cardHtml(o.c,`data-i="${o.i}"`)).join('')||'<p>選べるカードがない</p>'}</div><button class="sub" onclick="closeModal()">やめる</button>`);
  document.querySelectorAll('#modal .list .card').forEach(el=>el.onclick=()=>{closeModal();cb(+el.dataset.i)});
}
function showRest(){B=null;
  const h=Math.round(run.maxHp*P['休憩の回復割合']);
  app.innerHTML=`<div class="scr">${hudHtml()}<div class="panel"><h2>🔥 休憩</h2><p style="text-align:center">焚き火がある。どちらか1つ。</p>
    <button id="r1">休む（HP+${h}）</button><button id="r2">鍛える（カード1枚を強化）</button></div></div><div id="modal"></div>`;
  hudBind();
  $('#r1').onclick=()=>{run.hp=Math.min(run.maxHp,run.hp+h);sfx('win');showMap()};
  $('#r2').onclick=()=>pickCard('強化するカード',c=>!c.up,i=>{run.deck[i].up=true;sfx('win');showMap()});
}
function showShop(){B=null;
  const cards=rollCards(3).map(c=>({...c,price:{c:45,u:70,r:110}[CARDS[c.id].r]+rnd(10)}));
  const relic=rollRelic();const rp=135+rnd(20);let rmUsed=false;
  const draw=()=>{
    app.innerHTML=`<div class="scr">${hudHtml()}<div class="panel"><h2>🛒 店</h2>
      <div class="choices">${cards.map((c,i)=>`<div style="display:flex;flex-direction:column;gap:4px;align-items:center;flex:0 1 110px">${c.sold?'<div class="card" style="opacity:.3">売り切れ</div>':cardHtml(c,`data-i="${i}"`)}<b style="color:${run.gold>=c.price?'var(--gold)':'#888'}">${c.sold?'':'💰'+c.price}</b></div>`).join('')}</div>
      ${relic?`<button class="sub opt" id="br" ${run.gold<rp||run.relics.includes(relic)?'disabled':''}>${RELICS[relic].ic} ${RELICS[relic].n}（${RELICS[relic].tx}）💰${rp}</button>`:''}
      <button class="sub opt" id="rm" ${run.gold<P['カード削除の値段']||rmUsed?'disabled':''}>🗑 カードを1枚捨てる 💰${P['カード削除の値段']}</button>
      <button id="out">店を出る</button></div></div><div id="modal"></div>`;
    hudBind();
    document.querySelectorAll('.choices .card[data-i]').forEach(el=>el.onclick=()=>{const c=cards[+el.dataset.i];if(c.sold||run.gold<c.price){sfx('bad');return}
      run.gold-=c.price;c.sold=1;run.deck.push({id:c.id,up:c.up});sfx('coin');draw()});
    if($('#br'))$('#br').onclick=()=>{run.gold-=rp;run.relics.push(relic);sfx('coin');draw()};
    $('#rm').onclick=()=>pickCard('捨てるカード',()=>true,i=>{run.deck.splice(i,1);run.gold-=P['カード削除の値段'];rmUsed=true;sfx('coin');draw()});
    $('#out').onclick=()=>showMap();
  };draw();
}
const EVENTS=[
  {t:'道端のお地蔵さま',d:'苔むしたお地蔵さまが立っている。',ops:[{l:'手を合わせる（最大HP+6）',f:()=>{run.maxHp+=6;run.hp+=6}},{l:'通り過ぎる',f:()=>{}}]},
  {t:'怪しい行商人',d:'「とっておきの技を30ゴールドでどうだい」',ops:[{l:'買う（−30ゴールド・珍しい技）',ok:()=>run.gold>=30,f:()=>{run.gold-=30;const id=pick(Object.keys(CARDS).filter(k=>CARDS[k].r==='r'));run.deck.push({id,up:false});return`「${CARDS[id].n}」を覚えた`}},{l:'断る',f:()=>{}}]},
  {t:'荒れた稽古場',d:'誰もいない稽古場。体を張れば技が磨ける。',ops:[{l:'稽古する（HP−7・ランダムに1枚強化）',ok:()=>run.hp>7,f:()=>{run.hp-=7;const c=shuffle(run.deck.filter(c=>!c.up))[0];if(c){c.up=true;return`「${cname(c)}」になった`}}},{l:'通り過ぎる',f:()=>{}}]},
  {t:'古い道場',d:'師範が言う。「技を一つ忘れなさい。身軽になる」',ops:[{l:'忘れる（カードを1枚選んで捨てる）',pick:1},{l:'断る',f:()=>{}}]},
  {t:'落ちていた財布',d:'道に財布が落ちている。',ops:[{l:'拾う（+40ゴールド）',f:()=>{run.gold+=40}},{l:'交番に届ける（最大HP+3、HP全快）',f:()=>{run.maxHp+=3;run.hp=run.maxHp}}]},
  {t:'力自慢の像',d:'岩を持ち上げる力士の像。台座に「押せ」と彫られている。',ops:[{l:'押してみる（HP−5・お守りをもらう）',ok:()=>run.hp>5,f:()=>{run.hp-=5;const r=rollRelic();if(r){run.relics.push(r);return`${RELICS[r].ic}「${RELICS[r].n}」を手に入れた`}}},{l:'やめておく',f:()=>{}}]},
];
function showEvent(){B=null;
  const ev=pick(EVENTS);
  app.innerHTML=`<div class="scr">${hudHtml()}<div class="panel"><h2>❓ ${ev.t}</h2><p style="text-align:center">${ev.d}</p>
    ${ev.ops.map((o,i)=>`<button class="${i?'sub':''} opt" data-i="${i}" ${o.ok&&!o.ok()?'disabled':''}>${o.l}</button>`).join('')}<p id="evr" style="text-align:center;font-weight:800"></p></div></div><div id="modal"></div>`;
  hudBind();
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const o=ev.ops[+b.dataset.i];
    if(o.pick)return pickCard('捨てるカード',()=>true,i=>{run.deck.splice(i,1);sfx('coin');showMap()});
    const r=o.f();sfx('coin');if(r){$('#evr').textContent=r;document.querySelectorAll('.opt').forEach(x=>x.disabled=true);setTimeout(showMap,1200)}else showMap()});
}

/* =====================================================================
   終わり・タイトル
   ===================================================================== */
function scoreOf(win){const s=run.stats;return run.floorsDone*100+s.falls*15+s.ff*25+s.kills*5+(win?1000:0)-run.retries*80}
function rankOf(sc){return sc>=1700?'S':sc>=1200?'A':sc>=700?'B':'C'}
function gameOver(){
  B.busy=true;const snap=B.snap,spec=B.spec;
  setTimeout(()=>showEnd(false,snap,spec),400);
}
function showEnd(win,snap,spec){
  clearRun();
  const sc=scoreOf(win),rk=rankOf(sc),s=run.stats;
  const best=ls.get('oshidashi.best',{score:0});const nb=sc>best.score;if(nb)ls.set('oshidashi.best',{score:sc,floor:run.floorsDone,win,rank:rk});
  const reach=win?'大鬼を倒した！':`${run.pos?run.pos.f+1:1}階で力尽きた`;
  app.innerHTML=`<div class="scr"><div class="panel"><h2>${win?'優勝！':'負けた…'}</h2>
    <p style="text-align:center;font-weight:800">${reach}</p>
    <div class="rank">${rk}</div><p style="text-align:center">スコア ${sc}${nb?' <b style="color:var(--gold)">自己ベスト！</b>':''}</p>
    <div class="stats">倒した敵 ${s.kills}　<br>穴に落とした ${s.falls}（×15）<br>同士討ち ${s.ff}（×25）<br>いちばん痛い衝突 ${s.maxColl}<br>やり直し ${run.retries}回</div>
    ${!win&&snap?`<button id="retry">この戦闘をやり直す</button>`:''}
    <button class="${!win&&snap?'sub':''}" id="again">最初から</button><button class="sub" id="tt">タイトルへ</button></div></div>`;
  if(win){sfx('win');confetti()}
  if($('#retry'))$('#retry').onclick=()=>{run=snap;run.retries++;startBattle(spec.kind,spec)};
  $('#again').onclick=()=>{newRun();run.pos={f:0,i:0};startBattle('tut')};
  $('#tt').onclick=()=>showTitle();
}
function confetti(){for(let i=0;i<60;i++){const el=document.createElement('div');el.className='conf';el.style.left=Math.random()*100+'%';
  el.style.background=pick(['#f2c14e','#e94d4a','#4fa3ff','#5fcf8f','#fff']);el.style.animationDuration=(1.6+Math.random()*1.6)+'s';el.style.animationDelay=Math.random()*.6+'s';app.appendChild(el);setTimeout(()=>el.remove(),4000)}}
function showTitle(){
  B=null;
  const saved=ls.get('oshidashi.run',null);const best=ls.get('oshidashi.best',null);
  app.innerHTML=`<div class="scr title">
    <h1>オシダシ</h1><div class="tag">押して、ぶつけて、落とせ。</div>
    <div class="demo"><span class="p">🥋</span><span class="e">👹</span><span>🕳️</span></div>
    <div class="btns"><button id="go">はじめる</button>${saved&&saved.ver===1?'<button class="sub" id="cont">つづきから</button>':''}<button class="sub" id="how">遊び方</button></div>
    <div class="best">${best?`自己ベスト ${best.score}（${best.rank}）${best.win?' 優勝':` ${best.floor}階まで`}`:'デッキ構築 × マス目タクティクス'}</div>
  </div><div id="modal"></div>`;
  // 最初の3分で面白さを（桜井 #017）：説明画面を挟まず、いきなり1戦目（チュートリアル込み）
  $('#go').onclick=()=>{ac();sfx('win');newRun();run.pos={f:0,i:0};startBattle('tut')};
  if($('#cont'))$('#cont').onclick=()=>{ac();run=saved;showMap()};
  $('#how').onclick=()=>{run=run||{relics:[],gold:0,hp:0,maxHp:1};showHelp()};
}

/* ---------- 自動プレイ（確認用：?debug で window.autoplay()） ---------- */
window.__state=()=>({run,B});
window.autoStep=async function(){
  if(!B||!B.dom||B.busy||B.won||B.dead)return false;
  for(let i=0;i<B.hand.length;i++){const c=B.hand[i];if(playable(c))continue;const d=CARDS[c.id];
    if(d.t==='self'){await playCard(i);return true}const t=cardTargets(c);if(t.length){await playCard(i,pick(t));return true}}
  const R=[...reachMap().values()].filter(v=>!unitAt(v.x,v.y));
  if(R.length&&B.move>0&&Math.random()<.7){const v=pick(R);await movePl(v.x,v.y);return true}
  await endTurn();return true;
};
showTitle();
