<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFD84D">
<title>ポチ道場</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="mini-category" content="other">
<meta name="mini-desc" content="ルーレットで決まる6種のミニゲーム。クリアでコイン（1日3回まで）">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: one phone-width column — coin bar, today's game card, game stage that turns into the play area */
:root{
  --bg:#FFD84D; --ink:#2A1B3D; --pop:#FF4F79; --mint:#2EC4B6; --paper:#FFF6D6; --shade:#E8B92E;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:500;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:max(24px,env(safe-area-inset-bottom,0px));margin:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
  background-image:radial-gradient(var(--shade) 1.5px,transparent 1.5px);background-size:18px 18px}
.wrap{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.logo{font-family:var(--display);font-size:22px;letter-spacing:.02em}
.wallet{display:flex;gap:6px}
.chip{background:var(--ink);color:var(--paper);border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip b{color:var(--bg)}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:16px}
.today small{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--pop)}
.today h2{font-family:var(--display);font-size:34px;margin:4px 0 2px;font-weight:400}
.today p{margin:0 0 14px;font-size:14px}
button{font-family:inherit;cursor:pointer}
.go{width:100%;font-family:var(--display);font-size:24px;padding:14px;border:3px solid var(--ink);border-radius:14px;
  background:var(--pop);color:#fff;box-shadow:0 5px 0 var(--ink);transition:transform .06s}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.go:focus-visible,.pick:focus-visible,.sub:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick{border:3px solid var(--ink);border-radius:12px;background:var(--paper);padding:10px 4px;font-weight:800;font-size:14px;color:var(--ink)}
.pick span{display:block;font-family:var(--display);font-size:20px;font-weight:400}
.pick[aria-pressed="true"]{background:var(--mint);color:#fff}
.label{font-size:12px;font-weight:800;letter-spacing:.1em}
.note{font-size:12px;line-height:1.6;margin:0}
/* stage */
.stage{position:relative;width:100%;aspect-ratio:3/4;max-width:100%;background:var(--ink);border:3px solid var(--ink);
  border-radius:18px;overflow:hidden;box-shadow:5px 5px 0 var(--ink);user-select:none;-webkit-user-select:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:12px;right:12px;top:10px;display:flex;justify-content:space-between;color:var(--paper);
  font-weight:800;font-size:15px;pointer-events:none;font-variant-numeric:tabular-nums;z-index:3}
.timebar{position:absolute;left:0;bottom:0;height:8px;background:var(--bg);z-index:3}
.over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  text-align:center;color:var(--paper);z-index:5;padding:20px}
.big{font-family:var(--display);font-size:56px;line-height:1;color:var(--bg);text-shadow:4px 4px 0 var(--pop)}
.verb{animation:zoom .9s ease-out both}
@keyframes zoom{0%{transform:scale(2.4) rotate(-8deg);opacity:0}25%{transform:scale(1) rotate(-3deg);opacity:1}100%{transform:scale(1.08) rotate(-3deg)}}
.sub{border:3px solid var(--paper);background:transparent;color:var(--paper);border-radius:12px;padding:10px 16px;font-weight:800;font-size:15px;text-decoration:none;display:inline-block}
.sub.main{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.gain{font-size:18px;font-weight:800}
.balloon{position:absolute;width:62px;height:76px;border-radius:50% 50% 48% 48%;z-index:2;
  box-shadow:inset -8px -10px 0 rgba(0,0,0,.15)}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:22px;background:var(--paper);opacity:.6}
.pop{animation:pop .18s ease-out forwards}
@keyframes pop{to{transform:scale(1.6);opacity:0}}
/* ルーレット */
.roul{font-family:var(--display);font-size:44px;line-height:1.1;color:var(--paper);min-height:1.2em}
.roul.land{color:var(--bg);text-shadow:4px 4px 0 var(--pop);animation:zoom .7s ease-out both}
/* 記録 */
.rec{display:grid;grid-template-columns:1fr auto auto;gap:6px 12px;font-size:14px;font-variant-numeric:tabular-nums;align-items:baseline}
.rec .n{font-weight:800}.rec .t{text-align:right}.rec .c{text-align:right;font-size:12px;opacity:.7}
.best{display:inline-block;background:var(--pop);color:#fff;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:800}
/* ナンプレ */
.np{position:absolute;inset:44px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:2}
.npg{display:grid;grid-template-columns:repeat(4,1fr);width:min(78%,300px);aspect-ratio:1;border:3px solid var(--paper);border-radius:8px;overflow:hidden}
.npg button{border:1px solid #4a3a63;background:#33244a;color:var(--paper);font-family:var(--display);font-size:clamp(22px,7vw,32px);padding:0}
.npg button.fix{background:#241935;color:var(--bg)}
.npg button.sel{background:var(--mint);color:#fff}
.npg button.bad{color:var(--pop)}
.npg button.br{border-right:3px solid var(--paper)}.npg button.bb{border-bottom:3px solid var(--paper)}
.npk{display:flex;gap:8px}
.npk button{width:54px;height:54px;border-radius:12px;border:3px solid var(--paper);background:transparent;color:var(--paper);font-family:var(--display);font-size:24px}
.npk button.x{font-family:var(--body);font-size:14px;font-weight:800}
@media (prefers-reduced-motion:reduce){.verb,.pop{animation-duration:.01s}}
</style>
</head><body>

<div class="wrap">
  <div class="top">
    <a class="logo" href="/Academylab/" target="_top" style="color:inherit;text-decoration:none">‹ ポチ道場</a>
    <div class="wallet">
      <span class="chip">今日 +<b id="coins">0</b></span>
      <span class="chip">Lv <b id="lv">1</b></span>
      <span class="chip">残り <b id="left">3</b>/3</span>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="over" id="home">
      
    </div>
  </div>

  <div class="card" style="display:flex;flex-direction:column;gap:10px">
    <div class="label">自己ベスト（クリアまでのタイム）</div>
    <div class="rec" id="rec"></div>
    <p class="note">スタートを押すと、6つのうちどれかがルーレットで決まります。クリアで +2コイン（1日3回まで、それ以降は練習）。コインはアカデミーの財布に入ります。今週ミニゲームでコインを取った日が増えるほどLvが大きく上がり、3日目にはほぼ取れない難しさになります。Lvは毎週月曜にリセット。前の週にコインを取っていれば1段上から、取らなかった週のあとは1段下からスタート。</p>
  </div>
</div>

<script>
const GAMES={
  stop:{name:'ストップ',verb:'とめろ！',desc:()=>`動くバーを緑ゾーンで止める（3回中1回）`},
  stack:{name:'スタック',verb:'つめ！',desc:()=>`ブロックを${P().stack.goal}段積む`},
  balloon:{name:'風船わり',verb:'われ！',desc:()=>`10秒で風船を${P().balloon.need}個わる`},
  invader:{name:'インベーダー',verb:'うて！',desc:()=>`${P().invader.time}秒以内に全滅させる。指で砲台を動かす`},
  catch:{name:'キャッチ',verb:'とれ！',desc:()=>`★を${P().catch.need}個とる。爆弾にさわるとアウト`},
  nanpure:{name:'ナンプレ',verb:'とけ！',desc:()=>`4×4を${P().nanpure.time}秒以内に。縦・横・2×2に1〜4を1つずつ`}
};
const IDS=Object.keys(GAMES), REWARD=2, CAP=3;
const LOG_KEY='pochiDojoLog2'; // アカデミーの財布がこの coinDays を読んでコインに換算する
const ACADEMY_URL='/Academylab/';

const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
function load(k,def){try{return JSON.parse(localStorage.getItem(k))??def}catch(e){return def}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
// 週（月曜はじまり）ごとにレベルをリセット。前の週にクリアしていれば翌週は1段上から、ゼロなら1段下げる
function weekKey(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
let log=load(LOG_KEY,{});
if(log.week!==weekKey()){
  const had=log.week!==undefined;
  if(!had)log.plays=0; // 旧版で使った回数は持ち越さない
  log.base=had?Math.max(0,(log.base||0)+((log.weekClears||0)>0?1:-1)):0;
  log.lastWeekClears=had?(log.weekClears||0):0;
  log.week=weekKey();log.weekClears=0;log.days=[];
}
if(log.date!==today()){log.date=today();log.plays=0}
if(!Array.isArray(log.days))log.days=[];
if(!log.coinDays||typeof log.coinDays!=='object')log.coinDays={};
save(LOG_KEY,log);
// 今週ミニゲームでコインを取った「日数」で一気に上がる：1日目は気軽、2日目でLv5〜7、3日目はLv9以上
const pastDays=()=>log.days.filter(d=>d!==today()).length;
const level=()=>log.base+4*pastDays()+log.plays;
// レベルごとの難易度（上がるほど狭く・速く・多く）
function P(L=level()){return{
  stop:{zone:Math.max(.04,.18-.022*L),speed:.8+.2*L,step:.3+.05*L},
  stack:{goal:Math.min(14,8+Math.floor(L/2)),width:Math.max(.28,.6-.05*L),speed:.5+.12*L,snap:Math.max(2,6-L*.8)},
  balloon:{need:Math.min(18,10+L),rise:1+.12*L,spawn:Math.max(280,420-20*L)},
  invader:{cols:Math.min(7,5+Math.floor(L/3)),rows:Math.min(5,3+Math.floor(L/3)),speed:.1+.025*L,fire:Math.max(450,1700-110*L),time:Math.max(20,30-L)},
  catch:{need:Math.min(20,10+L),fall:.35+.05*L,spawn:Math.max(260,650-35*L),bomb:Math.min(.42,.12+.03*L),time:20},
  nanpure:{holes:Math.min(11,6+Math.floor(L/2)),time:Math.max(30,60-3*L)}
}}
function refresh(){coins.textContent=REWARD*(log.coinDays[today()]||0);left.textContent=Math.max(0,CAP-log.plays);lv.textContent=level()+1}

const stage=document.getElementById('stage');
let current=null,cleanup=null,playStart=0;
function clearStage(){if(cleanup){cleanup();cleanup=null}stage.innerHTML=''}
const fmt=t=>t==null?'—':t.toFixed(1)+'秒';
function drawRec(){
  const b=log.best||{},n=log.clears||{};
  rec.innerHTML=IDS.map(id=>`<span class="n">${GAMES[id].name}</span><span class="t">${fmt(b[id])}</span><span class="c">クリア ${n[id]||0}回</span>`).join('');
}
function showHome(){
  clearStage();
  stage.innerHTML=`<div class="over"><div class="label" style="color:var(--bg)">今日のミニゲーム</div>
  <div class="big">？？？</div><div style="font-size:15px">何が出るかはスタートしてからのお楽しみ</div>
  <div style="font-size:12px;opacity:.8">Lv.${level()+1} ・ 今週ミニゲームを使った日 ${log.days.length}日</div>
  <button class="go" id="start" style="max-width:240px">スタート</button></div>`;
  document.getElementById('start').onclick=roulette;
  refresh();drawRec();
}
function roulette(){
  clearStage();
  const pool=IDS.filter(i=>i!==current);const pick=pool[Math.floor(Math.random()*pool.length)];
  stage.innerHTML=`<div class="over"><div class="label" style="color:var(--bg)">今回のゲームは…</div><div class="roul" id="roul"></div><div id="rdesc" style="font-size:15px;min-height:3em"></div></div>`;
  const el=document.getElementById('roul');let i=0,delay=60,timers=[];
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  function tick(){
    if(delay>260||reduce){current=pick;el.textContent=GAMES[pick].name;el.classList.add('land');
      document.getElementById('rdesc').textContent=GAMES[pick].desc();
      timers.push(setTimeout(()=>play(pick),1500));return}
    el.textContent=GAMES[IDS[i++%IDS.length]].name;delay*=1.18;timers.push(setTimeout(tick,delay));
  }
  tick();
  cleanup=()=>timers.forEach(clearTimeout);
}
function play(id){
  clearStage();
  stage.innerHTML=`<div class="over"><div class="big verb">${GAMES[id].verb}</div></div>`;
  const t=setTimeout(()=>{clearStage();playStart=performance.now();RUN[id]()},950);
  cleanup=()=>clearTimeout(t);
}
function finish(win,msg){
  if(cleanup){cleanup();cleanup=null}
  const id=current,el=(performance.now()-playStart)/1000;
  let gainTxt='',bestTxt='';
  if(win){
    log.best=log.best||{};log.clears=log.clears||{};
    log.clears[id]=(log.clears[id]||0)+1;
    const prev=log.best[id];
    if(prev==null||el<prev){log.best[id]=el;bestTxt=prev==null?`<span class="best">初クリア ${fmt(el)}</span>`:`<span class="best">自己ベスト更新！ ${fmt(prev)} → ${fmt(el)}</span>`}
    else bestTxt=`<div style="font-size:14px">タイム ${fmt(el)}（ベスト ${fmt(prev)}）</div>`;
    if(log.plays<CAP){log.plays++;log.weekClears++;if(!log.days.includes(today()))log.days.push(today());log.coinDays[today()]=(log.coinDays[today()]||0)+1;gainTxt=`+${REWARD}コイン！ 次から Lv.${level()+1}`}
    else gainTxt='今日の3回は使い切ったので練習モード（Lvは上がりません）';
    save(LOG_KEY,log);
  }
  refresh();drawRec();
  const o=document.createElement('div');o.className='over';o.style.background='rgba(42,27,61,.86)';
  o.innerHTML=`<div class="big verb">${win?'クリア！':'ざんねん'}</div>
  <div style="font-size:15px">${GAMES[id].name}：${msg}</div>${bestTxt}${gainTxt?`<div class="gain">${gainTxt}</div>`:''}
  <div class="row"><button class="sub" id="again">次のゲーム</button><button class="sub" id="back">もどる</button></div>
  ${win?`<a class="sub main" href="${ACADEMY_URL}" target="_top">このまま今日の1話を読む</a>`:''}`;
  stage.appendChild(o);
  o.querySelector('#again').onclick=roulette;
  o.querySelector('#back').onclick=showHome;
}
function makeCanvas(){
  const c=document.createElement('canvas');stage.appendChild(c);
  const r=stage.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  c.width=r.width*dpr;c.height=r.height*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);
  return {c,x,W:r.width,H:r.height};
}
function hud(l,r){const h=document.createElement('div');h.className='hud';h.innerHTML=`<span>${l}</span><span>${r}</span>`;stage.appendChild(h);return h}
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

const RUN={
  stop(){
    const {c,x,W,H}=makeCanvas(),h=hud('','');
    const p=P().stop;let tries=0,pos=0,dir=1,speed=p.speed,stopped=false,last=performance.now(),raf,flash=null;
    const zone=p.zone;
    const upd=()=>h.innerHTML=`<span>チャンス ${3-tries}</span><span>真ん中で タップ</span>`;upd();
    function draw(){
      x.clearRect(0,0,W,H);
      const bx=W*.08,bw=W*.84,by=H*.5-24;
      x.fillStyle='#3d2c55';x.fillRect(bx,by,bw,48);
      x.fillStyle=css('--mint');x.fillRect(bx+bw*(.5-zone/2),by,bw*zone,48);
      x.fillStyle=css('--paper');x.fillRect(bx+bw*pos-4,by-18,8,84);
      if(flash){x.fillStyle=flash.c;x.font=`32px ${css('--display')}`;x.textAlign='center';x.fillText(flash.t,W/2,H*.32)}
    }
    function loop(t){const dt=(t-last)/1000;last=t;
      if(!stopped){pos+=dir*speed*dt;if(pos>1){pos=1;dir=-1}if(pos<0){pos=0;dir=1}}
      draw();raf=requestAnimationFrame(loop)}
    raf=requestAnimationFrame(loop);
    const tap=()=>{if(stopped)return;stopped=true;tries++;
      const hit=Math.abs(pos-.5)<=zone/2;
      flash=hit?{t:'ピタッ！',c:css('--bg')}:{t:'おしい',c:css('--pop')};upd();
      setTimeout(()=>{
        if(hit)return finish(true,`${tries}回目で止めた`);
        if(tries>=3)return finish(false,'3回とも外れた');
        flash=null;speed+=p.step;stopped=false;pos=Math.random()<.5?0:1;dir=pos?-1:1;
      },650)};
    c.addEventListener('pointerdown',tap);
    cleanup=()=>{cancelAnimationFrame(raf);c.removeEventListener('pointerdown',tap)};
  },
  stack(){
    const p=P().stack,{c,x,W,H}=makeCanvas(),GOAL=p.goal,bh=H/13,h=hud('','');
    const tower=[{x:W*(1-p.width)/2,w:W*p.width}];
    let cur={x:0,w:W*p.width},dir=1,speed=W*p.speed,last=performance.now(),raf,done=false,cam=0;
    const cols=[css('--pop'),css('--mint'),css('--bg')];
    const upd=()=>h.innerHTML=`<span>${tower.length-1} / ${GOAL}段</span><span>タップで落とす</span>`;upd();
    function loop(t){const dt=(t-last)/1000;last=t;
      if(!done){cur.x+=dir*speed*dt;if(cur.x+cur.w>W){cur.x=W-cur.w;dir=-1}if(cur.x<0){cur.x=0;dir=1}}
      const target=Math.max(0,(tower.length+1)*bh-H*.62);cam+=(target-cam)*.15;
      x.clearRect(0,0,W,H);
      tower.forEach((b,i)=>{x.fillStyle=i===0?'#5a4675':cols[i%3];x.fillRect(b.x,H-(i+1)*bh+cam,b.w,bh-3)});
      if(!done){const i=tower.length;x.fillStyle=cols[i%3];x.fillRect(cur.x,H-(i+1)*bh+cam,cur.w,bh-3)}
      raf=requestAnimationFrame(loop)}
    raf=requestAnimationFrame(loop);
    const tap=()=>{if(done)return;const top=tower[tower.length-1];
      let l=Math.max(cur.x,top.x),r=Math.min(cur.x+cur.w,top.x+top.w);
      if(Math.abs(cur.x-top.x)<p.snap){l=top.x;r=top.x+top.w}
      if(r-l<=0){done=true;return setTimeout(()=>finish(false,`${tower.length-1}段で落ちた`),400)}
      tower.push({x:l,w:r-l});upd();
      if(tower.length-1>=GOAL){done=true;return setTimeout(()=>finish(true,`${GOAL}段 積みあげた`),400)}
      cur={x:Math.random()<.5?0:W-(r-l),w:r-l};dir=cur.x?-1:1;speed+=W*.06};
    c.addEventListener('pointerdown',tap);
    cleanup=()=>{cancelAnimationFrame(raf);c.removeEventListener('pointerdown',tap)};
  },
  balloon(){
    const p=P().balloon,r=stage.getBoundingClientRect(),W=r.width,H=r.height,TIME=10,NEED=p.need;
    const h=hud('',''),bar=document.createElement('div');bar.className='timebar';stage.appendChild(bar);
    const cols=[css('--pop'),css('--mint'),css('--bg'),'#9B6BFF'];
    let got=0,start=performance.now(),lastSpawn=0,raf,list=[],over=false;
    const upd=t=>{h.innerHTML=`<span>わった ${got} / ${NEED}</span><span>${Math.max(0,t).toFixed(1)}秒</span>`;bar.style.width=Math.max(0,t/TIME*100)+'%'};
    function spawn(){const b=document.createElement('div');b.className='balloon';
      b.style.background=cols[Math.floor(Math.random()*cols.length)];
      const o={el:b,x:Math.random()*(W-70)+4,y:H+10,v:H*p.rise/(2.2+Math.random()*1.2)};
      b.style.left=o.x+'px';b.style.top=o.y+'px';
      b.addEventListener('pointerdown',e=>{e.stopPropagation();if(over||o.dead)return;o.dead=true;got++;b.classList.add('pop');setTimeout(()=>b.remove(),200);
        if(got>=NEED){over=true;finish(true,`${((performance.now()-start)/1000).toFixed(1)}秒で${NEED}個`)}});
      stage.appendChild(b);list.push(o)}
    function loop(t){const rem=TIME-(t-start)/1000;upd(rem);
      if(t-lastSpawn>p.spawn){spawn();lastSpawn=t}
      const dt=Math.min(.05,(t-(loop.p||t))/1000);loop.p=t;list.forEach(o=>{if(o.dead)return;o.y-=o.v*dt;o.el.style.top=o.y+'px';if(o.y<-90){o.dead=true;o.el.remove()}});
      if(rem<=0&&!over){over=true;return finish(false,`${got}個 わった（あと${NEED-got}個）`)}
      if(!over)raf=requestAnimationFrame(loop)}
    raf=requestAnimationFrame(loop);
    cleanup=()=>{over=true;cancelAnimationFrame(raf)};
  },
  invader(){
    const p=P().invader,{c,x,W,H}=makeCanvas(),h=hud('',''),bar=document.createElement('div');bar.className='timebar';stage.appendChild(bar);
    const SP=['00100100','00011000','00111100','01011010','11111111','10100101'],px=Math.max(3,Math.floor(W/(p.cols*14)));
    const ew=8*px,eh=6*px,gx=ew*.55,gy=eh*.9;
    const gridW=p.cols*ew+(p.cols-1)*gx;let ox=(W-gridW)/2,oy=50,dir=1;
    const en=[];for(let r=0;r<p.rows;r++)for(let q=0;q<p.cols;q++)en.push({r,q,alive:true});
    let gun=W/2,shots=[],bombs=[],lastShot=0,lastBomb=performance.now(),raf,over=false,last=performance.now();
    const cols=[css('--pop'),css('--mint'),css('--bg'),'#9B6BFF',css('--paper')];
    const move=e=>{const r=c.getBoundingClientRect();gun=Math.max(18,Math.min(W-18,e.clientX-r.left))};
    c.addEventListener('pointerdown',move);c.addEventListener('pointermove',move);
    const epos=e=>({x:ox+e.q*(ew+gx),y:oy+e.r*(eh+gy)});
    function sprite(X,Y,col){x.fillStyle=col;for(let j=0;j<6;j++)for(let i=0;i<8;i++)if(SP[j][i]==='1')x.fillRect(X+i*px,Y+j*px,px,px)}
    function end(win,msg){if(over)return;over=true;setTimeout(()=>finish(win,msg),250)}
    function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;const rem=p.time-(t-playStart)/1000;
      const alive=en.filter(e=>e.alive);
      h.innerHTML=`<span>のこり ${alive.length}体</span><span>${Math.max(0,rem).toFixed(1)}秒</span>`;bar.style.width=Math.max(0,rem/p.time*100)+'%';
      if(!over){
        const minQ=Math.min(...alive.map(e=>e.q)),maxQ=Math.max(...alive.map(e=>e.q));
        const sp=W*p.speed*(1+1.5*(1-alive.length/en.length));
        ox+=dir*sp*dt;
        if(ox+minQ*(ew+gx)<6&&dir<0||ox+maxQ*(ew+gx)+ew>W-6&&dir>0){dir*=-1;oy+=eh*.8}
        if(t-lastShot>260){shots.push({x:gun,y:H-46});lastShot=t}
        if(t-lastBomb>p.fire&&alive.length){const e=alive[Math.floor(Math.random()*alive.length)],q=epos(e);bombs.push({x:q.x+ew/2,y:q.y+eh});lastBomb=t}
        shots.forEach(s=>s.y-=H*1.3*dt);shots=shots.filter(s=>s.y>-10&&!s.hit);
        bombs.forEach(b=>b.y+=H*.42*dt);bombs=bombs.filter(b=>b.y<H+10);
        for(const s of shots)for(const e of alive){const q=epos(e);if(e.alive&&s.x>q.x-2&&s.x<q.x+ew+2&&s.y>q.y&&s.y<q.y+eh){e.alive=false;s.hit=true;break}}
        if(!en.some(e=>e.alive))end(true,`${(p.time-rem).toFixed(1)}秒で全滅`);
        else if(Math.max(...en.filter(e=>e.alive).map(e=>epos(e).y+eh))>H-60)end(false,'インベーダーが降りてきた');
        else if(bombs.some(b=>Math.abs(b.x-gun)<16&&b.y>H-44&&b.y<H-20))end(false,'撃たれた');
        else if(rem<=0)end(false,`時間切れ（のこり${alive.length}体）`);
      }
      x.clearRect(0,0,W,H);
      en.forEach(e=>{if(!e.alive)return;const q=epos(e);sprite(q.x,q.y,cols[e.r%cols.length])});
      x.fillStyle=css('--paper');shots.forEach(s=>x.fillRect(s.x-1.5,s.y,3,10));
      x.fillStyle=css('--pop');bombs.forEach(b=>{x.fillRect(b.x-2,b.y,4,4);x.fillRect(b.x,b.y+4,4,4);x.fillRect(b.x-2,b.y+8,4,4)});
      x.fillStyle=css('--mint');x.fillRect(gun-16,H-30,32,10);x.fillRect(gun-4,H-40,8,10);
      x.fillStyle='#3d2c55';x.fillRect(0,H-16,W,2);
      raf=requestAnimationFrame(loop)}
    raf=requestAnimationFrame(loop);
    cleanup=()=>{over=true;cancelAnimationFrame(raf);c.removeEventListener('pointerdown',move);c.removeEventListener('pointermove',move)};
  },
  catch(){
    const p=P().catch,{c,x,W,H}=makeCanvas(),h=hud('',''),bar=document.createElement('div');bar.className='timebar';stage.appendChild(bar);
    let bx=W/2,items=[],got=0,lastSpawn=0,raf,over=false,last=performance.now();const BW=Math.max(64,W*.2);
    const move=e=>{const r=c.getBoundingClientRect();bx=Math.max(BW/2,Math.min(W-BW/2,e.clientX-r.left))};
    c.addEventListener('pointerdown',move);c.addEventListener('pointermove',move);
    function end(win,msg){if(over)return;over=true;setTimeout(()=>finish(win,msg),250)}
    function star(X,Y,R){x.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?R*.45:R;x.lineTo(X+Math.cos(a)*rr,Y+Math.sin(a)*rr)}x.closePath();x.fill()}
    function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;const rem=p.time-(t-playStart)/1000;
      h.innerHTML=`<span>★ ${got} / ${p.need}</span><span>${Math.max(0,rem).toFixed(1)}秒</span>`;bar.style.width=Math.max(0,rem/p.time*100)+'%';
      if(!over){
        if(t-lastSpawn>p.spawn){items.push({x:20+Math.random()*(W-40),y:30,bomb:Math.random()<p.bomb,v:H*p.fall*(.85+Math.random()*.4)});lastSpawn=t}
        items.forEach(o=>o.y+=o.v*dt);
        for(const o of items){if(o.y>H-58&&o.y<H-30&&Math.abs(o.x-bx)<BW/2+6){o.done=true;if(o.bomb){end(false,'爆弾をとってしまった');break}got++;if(got>=p.need)end(true,`${(p.time-rem).toFixed(1)}秒で${p.need}個`)}}
        items=items.filter(o=>!o.done&&o.y<H+20);
        if(rem<=0)end(false,`時間切れ（${got}個）`);
      }
      x.clearRect(0,0,W,H);
      items.forEach(o=>{if(o.bomb){x.fillStyle='#120b1c';x.beginPath();x.arc(o.x,o.y,13,0,7);x.fill();x.strokeStyle=css('--pop');x.lineWidth=3;x.stroke();x.fillStyle=css('--bg');x.fillRect(o.x+6,o.y-18,4,6)}else{x.fillStyle=css('--bg');star(o.x,o.y,15)}});
      x.fillStyle=css('--mint');x.fillRect(bx-BW/2,H-40,BW,14);x.fillRect(bx-BW/2,H-58,8,18);x.fillRect(bx+BW/2-8,H-58,8,18);
      raf=requestAnimationFrame(loop)}
    raf=requestAnimationFrame(loop);
    cleanup=()=>{over=true;cancelAnimationFrame(raf);c.removeEventListener('pointerdown',move);c.removeEventListener('pointermove',move)};
  },
  nanpure(){
    const p=P().nanpure,h=hud('',''),bar=document.createElement('div');bar.className='timebar';stage.appendChild(bar);
    // 正しい4×4を作ってシャッフル
    let g=[[1,2,3,4],[3,4,1,2],[2,1,4,3],[4,3,2,1]];
    const perm=[1,2,3,4].sort(()=>Math.random()-.5);g=g.map(r=>r.map(v=>perm[v-1]));
    const sw=(a,i,j)=>{[a[i],a[j]]=[a[j],a[i]]};
    if(Math.random()<.5)sw(g,0,1);if(Math.random()<.5)sw(g,2,3);if(Math.random()<.5){sw(g,0,2);sw(g,1,3)}
    if(Math.random()<.5)g=g[0].map((_,i)=>g.map(r=>r[i]));
    if(Math.random()<.5)g=g.map(r=>{r=r.slice();sw(r,0,1);return r});
    const cells=g.flat().map(v=>({v,fix:true}));
    const idx=[...Array(16).keys()].sort(()=>Math.random()-.5).slice(0,p.holes);idx.forEach(i=>{cells[i].fix=false;cells[i].v=0});
    let sel=cells.findIndex(c=>!c.fix),raf,over=false;
    const box=document.createElement('div');box.className='np';
    box.innerHTML=`<div class="npg" id="npg"></div><div class="npk">${[1,2,3,4].map(n=>`<button data-n="${n}">${n}</button>`).join('')}<button class="x" data-n="0">けす</button></div>`;
    stage.appendChild(box);const grid=box.querySelector('#npg');
    const bad=i=>{const v=cells[i].v;if(!v)return false;const r=Math.floor(i/4),q=i%4;
      return cells.some((c,j)=>j!==i&&c.v===v&&(Math.floor(j/4)===r||j%4===q||(Math.floor(j/8)===Math.floor(i/8)&&Math.floor(q/2)===Math.floor((j%4)/2))))};
    function draw(){grid.innerHTML=cells.map((c,i)=>`<button data-i="${i}" class="${c.fix?'fix':''} ${i===sel?'sel':''} ${bad(i)?'bad':''} ${i%4===1?'br':''} ${Math.floor(i/4)===1?'bb':''}">${c.v||''}</button>`).join('')}
    draw();
    grid.onclick=e=>{const b=e.target.closest('[data-i]');if(!b||over)return;const i=+b.dataset.i;if(cells[i].fix)return;sel=i;draw()};
    box.querySelector('.npk').onclick=e=>{const b=e.target.closest('[data-n]');if(!b||over||sel<0)return;cells[sel].v=+b.dataset.n;draw();
      if(cells.every((c,i)=>c.v&&!bad(i))){over=true;setTimeout(()=>finish(true,`${((performance.now()-playStart)/1000).toFixed(1)}秒で完成`),300)}};
    function loop(t){const rem=p.time-(t-playStart)/1000;
      h.innerHTML=`<span>空き ${cells.filter(c=>!c.v).length}マス</span><span>${Math.max(0,rem).toFixed(1)}秒</span>`;bar.style.width=Math.max(0,rem/p.time*100)+'%';
      if(rem<=0&&!over){over=true;return finish(false,'時間切れ')}
      if(!over)raf=requestAnimationFrame(loop)}
    raf=requestAnimationFrame(loop);
    cleanup=()=>{over=true;cancelAnimationFrame(raf)};
  }
};
showHome();
</script>
